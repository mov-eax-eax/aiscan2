<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>La Tour Eiffel · three.js</title>
<style>
  :root {
    --ink: #f2ede3;
    --muted: rgba(242, 237, 227, 0.62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a12; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- overlay chrome ---------- */
  .hud {
    position: fixed; inset: 0; z-index: 2;
    padding: clamp(18px, 3vw, 42px);
    display: flex; flex-direction: column; justify-content: space-between;
    pointer-events: none;
  }
  .brand h1 {
    margin: 0;
    font-weight: 200;
    font-size: clamp(17px, 2vw, 28px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55);
  }
  .brand p {
    margin: 11px 0 0;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bottom {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
  }
  .hint {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
  }
  .hint b { font-weight: 600; color: var(--ink); }
  .controls { display: flex; gap: 8px; pointer-events: auto; }
  .controls button {
    appearance: none;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 16px;
    border: 1px solid rgba(242, 237, 227, 0.22);
    border-radius: 999px;
    background: rgba(12, 16, 26, 0.42);
    color: var(--ink);
    font: inherit;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.25s, border-color 0.25s, transform 0.1s;
  }
  .controls button:hover { background: rgba(30, 38, 54, 0.6); border-color: rgba(242, 237, 227, 0.45); }
  .controls button:active { transform: scale(0.97); }
  .controls .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(242, 237, 227, 0.32);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .controls button.on .dot { background: #ffc06a; box-shadow: 0 0 9px #ffc06a; }

  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 42%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.45) 100%);
  }

  /* ---------- loader / error ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 9;
    display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 38%, #141a26 0%, #05070c 70%);
    transition: opacity 0.8s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #loader .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(242, 237, 227, 0.14);
    border-top-color: #ffc06a;
    animation: spin 1s linear infinite;
  }
  #loader span { font-size: 9px; letter-spacing: 0.36em; text-transform: uppercase; color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: 24px; text-align: center;
    background: #070a12;
  }
  #error[hidden] { display: none; }
  #error h2 { font-weight: 300; letter-spacing: 0.22em; text-transform: uppercase; font-size: 15px; }
  #error p { font-size: 13px; line-height: 1.7; color: var(--muted); max-width: 420px; margin: 14px auto 0; }

  @media (max-width: 640px) {
    .brand h1 { letter-spacing: 0.3em; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div class="hud">
  <header class="brand">
    <h1>La Tour Eiffel</h1>
    <p>Gustave Eiffel · 1889 &nbsp;—&nbsp; procedural lattice</p>
  </header>
  <div class="bottom">
    <div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; <b>300 m</b> of iron</div>
    <div class="controls">
      <button id="btn-night" aria-label="Toggle night lighting"><span class="dot"></span><span id="btn-night-label">Night</span></button>
      <button id="btn-auto" class="on" aria-label="Toggle auto orbit"><span class="dot"></span><span>Orbit</span></button>
    </div>
  </div>
</div>

<div id="loader"><div class="inner"><div class="ring"></div><span>assembling the iron</span></div></div>
<div id="error" hidden><div><h2>WebGL unavailable</h2><p id="error-text">three.js could not be loaded.</p></div></div>

<script type="module">
/* 00-three.js — load three.js from a CDN with fallbacks.
   This fragment runs first and its top-level await gates the whole bundle. */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',
  'https://unpkg.com/three@0.160.1/build/three.module.js',
  'https://esm.sh/three@0.160.1',
];

let THREE = null;
for (const url of CDNS) {
  try { THREE = await import(url); break; }
  catch (err) { console.warn('[eiffel] three.js failed from', url); }
}

const loaderEl = document.getElementById('loader');
const errorEl = document.getElementById('error');
const errorText = document.getElementById('error-text');
function fail(message) {
  loaderEl.classList.add('hide');
  errorEl.hidden = false;
  errorText.textContent = message;
}
if (!THREE) {
  fail('three.js could not be downloaded from any CDN. Check the connection and reload the page.');
  throw new Error('three.js unavailable');
}


/* 10-utils.js — math helpers and the shared world constants.
   Everything in src/ is concatenated into one module scope, so these are
   simply in scope for every other fragment. */
/* ------------------------------------------------------------------ */
/*  small helpers                                                     */
/* ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mix = (a, b, t) => a + (b - a) * t;

/** Smooth Hermite interpolation through [y, value] anchors. */
function smoothCurve(anchors) {
  const n = anchors.length;
  const slopes = new Array(n);
  for (let i = 0; i < n; i++) {
    if (i === 0) slopes[i] = (anchors[1][1] - anchors[0][1]) / (anchors[1][0] - anchors[0][0]);
    else if (i === n - 1) slopes[i] = (anchors[n - 1][1] - anchors[n - 2][1]) / (anchors[n - 1][0] - anchors[n - 2][0]);
    else slopes[i] = (anchors[i + 1][1] - anchors[i - 1][1]) / (anchors[i + 1][0] - anchors[i - 1][0]);
  }
  return function (y) {
    if (y <= anchors[0][0]) return anchors[0][1];
    if (y >= anchors[n - 1][0]) return anchors[n - 1][1];
    let i = 0;
    while (i < n - 2 && y > anchors[i + 1][0]) i++;
    const y0 = anchors[i][0], v0 = anchors[i][1];
    const y1 = anchors[i + 1][0], v1 = anchors[i + 1][1];
    const h = y1 - y0;
    const t = (y - y0) / h;
    const t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * v0
         + (t3 - 2 * t2 + t) * h * slopes[i]
         + (-2 * t3 + 3 * t2) * v1
         + (t3 - t2) * h * slopes[i + 1];
  };
}

/* Shared layout constants — keep the modules agreeing about the map. */
const WORLD = {
  cityInner: 760,       // radius where the grey city floor starts
  cityOuter: 3400,      // radius of that floor
  ringY: 0.6,           // city-floor height (above ground=0, avoids z-fighting)
  riverZ: -330,         // Seine centre line (behind the tower)
  riverWidth: 220,
  waterY: 1.2,
  mallWidth: 58,        // Champ de Mars allée
  mallStart: 100,
  mallEnd: 740,
  groundY: 0,
};

/* Reserved landmark spots. The city fabric must leave these clearings empty;
   the landmark module builds inside them. Coordinates are world x / z (metres). */
const LANDMARK_SITES = {
  ecoleMilitaire: { x: 0, z: 830, clearing: 170 },
  trocadero:      { x: 0, z: -640, clearing: 210 },
  montparnasse:   { x: 980, z: -260, clearing: 90 },
  defense:        { x: -1280, z: -880, clearing: 200 },
};


/* 20-env.js — the day/night dial plus the tiny observer registry that lets each
   module light and animate its own objects without editing the composition root.

   - ENV.night / ENV.nightTarget : 0 = golden hour, 1 = night
   - registerEnv(fn)             : fn(night) runs every frame after the dial eases
   - registerUpdater(fn)         : fn(dt, elapsed) runs every frame before render
   Keep side effects inside your own module; never mutate another module's state. */

const ENV = { night: 0, nightTarget: 0 };
// deep link straight to the night view: index.html#night
if (location.hash === '#night') { ENV.night = 1; ENV.nightTarget = 1; }

const PALETTE = {
  skyTopDay: new THREE.Color(0x3f6fb8),
  skyTopNight: new THREE.Color(0x02040c),
  skyBotDay: new THREE.Color(0xf4d3a6),
  skyBotNight: new THREE.Color(0x0e1a30),
  fogDay: new THREE.Color(0xdfd2be),
  fogNight: new THREE.Color(0x0a1120),
  hemiSkyDay: new THREE.Color(0xc9dcff),
  hemiSkyNight: new THREE.Color(0x1a2744),
  hemiGroundDay: new THREE.Color(0x6b5942),
  hemiGroundNight: new THREE.Color(0x0b0d14),
};

const envHandlers = [];
const updaters = [];
let envScene = null;

function initEnv(scene) {
  envScene = scene;
  scene.fog = new THREE.Fog(0xdfd2be, 900, 3200);
}

function registerEnv(handler) {
  envHandlers.push(handler);
}

function registerUpdater(fn) {
  updaters.push(fn);
}

function tickEnv(dt) {
  ENV.night += (ENV.nightTarget - ENV.night) * (1 - Math.exp(-dt * 2.2));
  if (Math.abs(ENV.nightTarget - ENV.night) < 0.001) ENV.night = ENV.nightTarget;

  for (let i = 0; i < envHandlers.length; i++) envHandlers[i](ENV.night);

  if (envScene && envScene.fog) {
    envScene.fog.color.copy(PALETTE.fogDay).lerp(PALETTE.fogNight, ENV.night);
  }
}

function runUpdaters(dt, elapsed) {
  for (let i = 0; i < updaters.length; i++) updaters[i](dt, elapsed);
}


/* 30-sky.js — gradient sky, stars and the sun/moon/fill rig.
   Registers its own day/night behaviour with registerEnv. */
function buildSky(scene) {
/* ------------------------------------------------------------------ */
/*  sky, stars                                                        */
/* ------------------------------------------------------------------ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x3f6fb8) },
    uBot: { value: new THREE.Color(0xf4d3a6) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vDir = wp.xyz - cameraPosition;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uTop;
    uniform vec3 uBot;
    varying vec3 vDir;
    void main() {
      float h = normalize(vDir).y;
      float t = smoothstep(-0.02, 0.34, h);
      vec3 c = mix(uBot, uTop, pow(t, 0.9));
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 32, 20), skyMat);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{
  const count = 2200;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const y = 0.04 + Math.random() * 0.96;
    const r = Math.sqrt(1 - y * y);
    pos[i * 3 + 0] = Math.cos(a) * r * 4400;
    pos[i * 3 + 1] = y * 4400;
    pos[i * 3 + 2] = Math.sin(a) * r * 4400;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({
  color: 0xdfe8ff, size: 1.7, sizeAttenuation: false,
  transparent: true, opacity: 0, depthWrite: false, fog: false,
});
const stars = new THREE.Points(starGeo, starMat);
stars.frustumCulled = false;
scene.add(stars);

/* ------------------------------------------------------------------ */
/*  lights                                                            */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xc9dcff, 0x6b5942, 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d8, 2.8);
sun.position.set(330, 300, 220);
sun.target.position.set(0, 120, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -320;
sun.shadow.camera.right = 320;
sun.shadow.camera.top = 300;
sun.shadow.camera.bottom = -300;
sun.shadow.camera.near = 60;
sun.shadow.camera.far = 1600;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.7;
scene.add(sun);
scene.add(sun.target);

const moon = new THREE.DirectionalLight(0x9ab4ff, 0);
moon.position.set(-420, 260, -300);
moon.target.position.set(0, 120, 0);
scene.add(moon);
scene.add(moon.target);

const fill = new THREE.DirectionalLight(0xbfd4ff, 0.5);
fill.position.set(-300, 160, 260);
fill.target.position.set(0, 120, 0);
scene.add(fill);
scene.add(fill.target);

  registerEnv((t) => {
    sun.intensity = mix(2.8, 0.04, t);
    moon.intensity = mix(0, 0.6, t);
    fill.intensity = mix(0.5, 0.12, t);
    hemi.intensity = mix(1.05, 0.42, t);
    hemi.color.copy(PALETTE.hemiSkyDay).lerp(PALETTE.hemiSkyNight, t);
    hemi.groundColor.copy(PALETTE.hemiGroundDay).lerp(PALETTE.hemiGroundNight, t);
    skyMat.uniforms.uTop.value.copy(PALETTE.skyTopDay).lerp(PALETTE.skyTopNight, t);
    skyMat.uniforms.uBot.value.copy(PALETTE.skyBotDay).lerp(PALETTE.skyBotNight, t);
    starMat.opacity = t * 0.95;
  });
}


/* 40-terrain.js — ground, plaza, city floor, the Seine and Pont d'Iéna.
   All near-coplanar surfaces are deliberately separated in Y; do not place
   overlay planes on the same Y or they will flicker. */
function buildTerrain(scene) {
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x444d36, roughness: 1 });
  const plazaMat = new THREE.MeshStandardMaterial({ color: 0x9c9080, roughness: 0.92 });
  const pathMat = new THREE.MeshStandardMaterial({ color: 0xa99e8b, roughness: 0.95 });
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x35697d, metalness: 0.35, roughness: 0.12 });
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x968b7c, metalness: 0.02, roughness: 0.96 });

/* ------------------------------------------------------------------ */
/*  ground, plaza, river, bridge                                      */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(100, 72), plazaMat);
plaza.rotation.x = -Math.PI / 2;
plaza.position.y = 0.25;
plaza.receiveShadow = true;
scene.add(plaza);

// the city floor, so the distant blocks don't float on a lawn
const urban = new THREE.Mesh(
  new THREE.RingGeometry(WORLD.cityInner, WORLD.cityOuter, 96),
  new THREE.MeshStandardMaterial({ color: 0x4b4944, roughness: 1 })
);
urban.rotation.x = -Math.PI / 2;
urban.position.y = WORLD.ringY;
urban.receiveShadow = true;
scene.add(urban);

// Champ de Mars, stretching away from the tower, and the short walk to the river
const mall = new THREE.Mesh(new THREE.PlaneGeometry(WORLD.mallWidth, WORLD.mallEnd - WORLD.mallStart), pathMat);
mall.rotation.x = -Math.PI / 2;
mall.position.set(0, 0.3, (WORLD.mallStart + WORLD.mallEnd) / 2);
mall.receiveShadow = true;
scene.add(mall);

const riverWalk = new THREE.Mesh(new THREE.PlaneGeometry(46, 124), pathMat);
riverWalk.rotation.x = -Math.PI / 2;
riverWalk.position.set(0, 0.3, -162.5);
riverWalk.receiveShadow = true;
scene.add(riverWalk);

// the Seine, crossing the scene behind the tower
const river = new THREE.Mesh(new THREE.PlaneGeometry(9000, WORLD.riverWidth), waterMat);
river.rotation.x = -Math.PI / 2;
river.position.set(0, WORLD.waterY, WORLD.riverZ);
scene.add(river);

for (const z of [-220, -440]) {
  const quay = new THREE.Mesh(new THREE.BoxGeometry(9000, 3.2, 4), stoneMat);
  quay.position.set(0, 0.5, z);
  scene.add(quay);
}

// Pont d'Iéna, on the tower's axis
{
  const deck = new THREE.Mesh(new THREE.BoxGeometry(40, 2.2, 224), stoneMat);
  deck.position.set(0, 1.9, -330);
  deck.castShadow = true;
  scene.add(deck);

  for (const x of [-19.5, 19.5]) {
    const parapet = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 224), stoneMat);
    parapet.position.set(x, 3.6, -330);
    scene.add(parapet);
  }
  for (const z of [-256, -330, -404]) {
    const pier = new THREE.Mesh(new THREE.BoxGeometry(34, 4.6, 9), stoneMat);
    pier.position.set(0, 0.4, z);
    scene.add(pier);
  }
}
}


/* 50-tower.js — the iron lady. Everything is generated from the silhouette
   curves below; no models. Registers night lighting + sparkle/beacon updaters. */
function buildTower(scene, renderer) {
  // deck surfaces sit slightly proud of the lattice ends so caps never z-fight
  const DECK_LIFT = 0.22;

  /* ---- materials ---- */
  const ironMat = new THREE.MeshStandardMaterial({
    color: 0x74604b, metalness: 0.5, roughness: 0.46,
    emissive: 0xffa14a, emissiveIntensity: 0,
  });
  const slabMat = new THREE.MeshStandardMaterial({
    color: 0x4d4238, metalness: 0.4, roughness: 0.65,
    emissive: 0xff9a4a, emissiveIntensity: 0,
  });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x7fa6b2, metalness: 0.5, roughness: 0.2,
    transparent: true, opacity: 0.45,
    emissive: 0xffcf96, emissiveIntensity: 0.08,
    side: THREE.DoubleSide,
  });
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x968b7c, metalness: 0.02, roughness: 0.96 });
  const mastMat = new THREE.MeshStandardMaterial({ color: 0xd6d1c6, metalness: 0.85, roughness: 0.35 });

  /* ---- night light rig ---- */
  const upA = new THREE.DirectionalLight(0xffa552, 0);
  upA.position.set(150, -90, 130);
  upA.target.position.set(0, 260, 0);
  scene.add(upA, upA.target);

  const upB = new THREE.DirectionalLight(0xff9a4a, 0);
  upB.position.set(-170, -70, -150);
  upB.target.position.set(0, 220, 0);
  scene.add(upB, upB.target);

  const baseGlow = new THREE.PointLight(0xffb066, 0, 320, 1.8);
  baseGlow.position.set(0, 26, 0);
  scene.add(baseGlow);

  const deckGlow = new THREE.PointLight(0xffbe7a, 0, 190, 1.8);
  deckGlow.position.set(0, 118, 0);
  scene.add(deckGlow);

/* ================================================================== */
/*  THE TOWER                                                         */
/* ================================================================== */

const TOWER_TOP = 300;
const ANTENNA_TOP = 332;

// how far the four corner pillars sit from the centre line
const halfWidth = smoothCurve([
  [0, 62.5], [57.6, 35.0], [115.7, 20.0], [200, 10.4], [276, 6.5], [300, 3.4],
]);
// the side of each corner pillar's square cross-section
const pillarWidth = smoothCurve([
  [0, 20.0], [57.6, 16.0], [115.7, 9.5], [200, 4.2], [276, 2.1], [300, 1.4],
]);
// radius of the main chords
const chordRadius = smoothCurve([
  [0, 1.0], [57.6, 0.58], [115.7, 0.42], [200, 0.34], [300, 0.26],
]);

// horizontal tiers: one panel per step
const lin = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
const levelsA = lin(0, 57.6, 18);
const levelsB = lin(57.6, 115.7, 14);
const levelsC = lin(115.7, 276, 34);
const levelsD = lin(276, 300, 8);
// the faces above the second floor get large X-braced panels, not a mesh
const faceTiersC = lin(115.7, 276, 14);

// the four faces: outward normal (nx, nz) and tangent (tx, tz)
const frames = [
  { nx: 0, nz: 1, tx: 1, tz: 0 },
  { nx: 1, nz: 0, tx: 0, tz: -1 },
  { nx: 0, nz: -1, tx: -1, tz: 0 },
  { nx: -1, nz: 0, tx: 0, tz: 1 },
];

const segs = [];
const member = (a, b, r) => segs.push({ a, b, r });

/* --- one corner pillar: a square lattice column -------------------- */
function pillarPoints(sx, sz, y) {
  const w = halfWidth(y);
  const c = pillarWidth(y);
  return [
    [sx * w, y, sz * w],
    [sx * (w - c), y, sz * w],
    [sx * (w - c), y, sz * (w - c)],
    [sx * w, y, sz * (w - c)],
  ];
}

function buildPillar(sx, sz, levels) {
  const first = pillarPoints(sx, sz, levels[0]);
  const r0 = chordRadius(levels[0]) * 0.7;
  for (let k = 0; k < 4; k++) member(first[k], first[(k + 1) % 4], r0);

  const lerp3 = (a, b, t) => [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t,
  ];

  for (let i = 0; i < levels.length - 1; i++) {
    const y0 = levels[i];
    const y1 = levels[i + 1];
    const p = pillarPoints(sx, sz, y0);
    const q = pillarPoints(sx, sz, y1);
    const r = chordRadius((y0 + y1) / 2);
    const cells = clamp(Math.round(pillarWidth((y0 + y1) / 2) / 4.2), 1, 3);

    for (let k = 0; k < 4; k++) {
      const k2 = (k + 1) % 4;
      const pv = [];
      const qv = [];
      for (let j = 0; j <= cells; j++) {
        const t = j / cells;
        pv.push(lerp3(p[k], p[k2], t));
        qv.push(lerp3(q[k], q[k2], t));
      }
      // vertical lattice bars (the outer ones are the main chords)
      for (let j = 0; j <= cells; j++) {
        const isChord = j === 0 || j === cells;
        member(pv[j], qv[j], isChord ? r : r * 0.68);
      }
      // X bracing inside every cell + rail along the top of the panel
      for (let j = 0; j < cells; j++) {
        member(pv[j], qv[j + 1], r * 0.48);
        member(pv[j + 1], qv[j], r * 0.48);
        member(qv[j], qv[j + 1], r * 0.6);
      }
    }
  }
}

for (const levels of [levelsA, levelsB, levelsC, levelsD]) {
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) buildPillar(sx, sz, levels);
  }
}

/* --- face lattice between two pillars ------------------------------ */
function facePoint(fr, u, y) {
  const w = halfWidth(y);
  const c = pillarWidth(y);
  const span = w - c;
  const offset = w - c / 2;
  return [
    fr.tx * u * span + fr.nx * offset,
    y,
    fr.tz * u * span + fr.nz * offset,
  ];
}

/* --- horizontal lattice girder band across a face ------------------- */
function bandGirder(fr, y, depth, segments) {
  const yT = y + depth / 2;
  const yB = y - depth / 2;
  const r = chordRadius(y);
  const span = 2 * (halfWidth(y) - pillarWidth(y));
  const n = Math.max(3, segments || Math.round(span / 3.6));

  const top = [];
  const bot = [];
  for (let j = 0; j <= n; j++) {
    const u = -1 + (2 * j) / n;
    top.push(facePoint(fr, u, yT));
    bot.push(facePoint(fr, u, yB));
  }
  for (let j = 0; j < n; j++) {
    member(top[j], top[j + 1], r * 1.15);  // chords of the girder
    member(bot[j], bot[j + 1], r * 1.15);
    member(top[j], bot[j + 1], r * 0.45);  // zig-zag web
    member(bot[j], top[j + 1], r * 0.45);
  }
  for (let j = 0; j <= n; j += Math.max(1, Math.round(n / 3))) {
    member(top[j], bot[j], r * 0.55);      // posts
  }
}

/* --- open bay between the first and second floors ------------------- */
// The real tower is wide open here: on every face the four legs are tied
// together only by the deep girder that carries the second floor.
function buildOpenBay() {
  for (const fr of frames) bandGirder(fr, 111.3, 4.8, 8);
}

/* --- large open X bracing on the faces above the second floor ------- */
function buildFaceBracing(levels, girderDepth) {
  for (const fr of frames) {
    for (let i = 0; i < levels.length - 1; i++) {
      const y0 = levels[i];
      const y1 = levels[i + 1];
      const r = chordRadius((y0 + y1) / 2);
      member(facePoint(fr, -1, y0), facePoint(fr, 1, y1), r * 1.9);
      member(facePoint(fr, 1, y0), facePoint(fr, -1, y1), r * 1.9);
    }
    for (let i = 1; i < levels.length; i++) bandGirder(fr, levels[i], girderDepth);
  }
}

/* --- the small dense cage at the very summit ------------------------ */
function buildDenseLattice(levels) {
  for (const fr of frames) {
    for (let i = 0; i < levels.length - 1; i++) {
      const y0 = levels[i];
      const y1 = levels[i + 1];
      const h = y1 - y0;
      const span = (halfWidth(y0) - pillarWidth(y0)) + (halfWidth(y1) - pillarWidth(y1));
      const n = clamp(Math.round(span / (h * 1.9)), 1, 9);
      const r = chordRadius((y0 + y1) / 2) * 0.78;

      const at = (u, y) => facePoint(fr, u, y);

      for (let j = 0; j <= n; j++) {
        const u = -1 + 2 * j / n;
        member(at(u, y0), at(u, y1), r * 0.72);
      }
      for (let j = 0; j < n; j++) {
        const u0 = -1 + 2 * j / n;
        const u1 = -1 + 2 * (j + 1) / n;
        member(at(u0, y0), at(u1, y1), r);
        member(at(u1, y0), at(u0, y1), r);
        member(at(u0, y0), at(u1, y0), r * 0.9);
      }
    }
  }
}

buildOpenBay();
buildFaceBracing(faceTiersC, 1.8);
buildDenseLattice(levelsD);

/* --- the great arches under the first floor ------------------------ */
function buildArch(fr) {
  const N = 26;
  const ySpring = 2.5;
  const rise = 50;
  const R = halfWidth(ySpring) - pillarWidth(ySpring);

  const top = [];
  const bot = [];
  for (let i = 0; i <= N; i++) {
    const th = Math.PI * (1 - i / N);
    const sn = Math.sin(th);
    const cs = Math.cos(th);
    const x = R * cs;

    const yT = ySpring + rise * sn;
    const yB = ySpring + (rise - 5) * sn;

    const wT = halfWidth(yT), cT = pillarWidth(yT);
    const wB = halfWidth(yB), cB = pillarWidth(yB);

    const zT = wT - cT / 2;
    const zB = wB - cB / 2;

    top.push([fr.tx * x + fr.nx * zT, yT, fr.tz * x + fr.nz * zT]);
    bot.push([fr.tx * x * 0.985 + fr.nx * zB, yB, fr.tz * x * 0.985 + fr.nz * zB]);
  }

  for (let i = 0; i < N; i++) {
    member(top[i], top[i + 1], 0.55);
    member(bot[i], bot[i + 1], 0.45);
    member(top[i], bot[i + 1], 0.34);
    member(bot[i], top[i + 1], 0.34);
  }
  for (let i = 0; i <= N; i += 3) member(top[i], bot[i], 0.26);
}

/* --- girder under the first floor ---------------------------------- */
for (const y of [54.8, 56.6]) {

    const right = [fr.tx * half + fr.nx * z, y, fr.tz * half + fr.nz * z];
    member(left, right, 0.55);
  }
}

/* --- platform railings (thin members, same instanced mesh) ---------- */
function addRailing(y, half, height) {
  const postR = 0.11;
  for (const fr of frames) {
    const n = Math.max(3, Math.round(2 * half / 5));
    let prev = null;
    for (let j = 0; j <= n; j++) {
      const u = -1 + 2 * j / n;
      const x = fr.tx * u * half + fr.nx * half;
      const z = fr.tz * u * half + fr.nz * half;
      member([x, y - 0.15, z], [x, y + height, z], postR * 1.5);
      if (prev) {
        member([prev[0], y + height, prev[2]], [x, y + height, z], postR * 1.1);
        member([prev[0], y + height * 0.55, prev[2]], [x, y + height * 0.55, z], postR * 0.8);
      }
      prev = [x, y, z];
    }
  }
}

/* --- build the instanced ironwork ---------------------------------- */
function buildStructure(list) {
  const geo = new THREE.CylinderGeometry(1, 1, 1, 6, 1, false);
  const mesh = new THREE.InstancedMesh(geo, ironMat, list.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false; // instances span far beyond the unit geometry

  const m4 = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0);
  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const dir = new THREE.Vector3();
  const mid = new THREE.Vector3();
  const sc = new THREE.Vector3();

  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    a.fromArray(s.a);
    b.fromArray(s.b);
    dir.subVectors(b, a);
    const len = dir.length();
    if (len < 1e-4) {
      mid.copy(a);
      sc.set(1e-3, 1e-3, 1e-3);
    } else {
      dir.divideScalar(len);
      q.setFromUnitVectors(up, dir);
      mid.addVectors(a, b).multiplyScalar(0.5);
      sc.set(s.r, len, s.r);
    }
    m4.compose(mid, q, sc);
    mesh.setMatrixAt(i, m4);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.name = 'ironwork';
  scene.add(mesh);
  return mesh;
}

buildStructure(segs);

  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

/* ------------------------------------------------------------------ */
/*  sparkle: the tower's hourly shimmer                               */
/* ------------------------------------------------------------------ */
const sparkleMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: 1 },
    uOpacity: { value: 0 },
  },
  vertexShader: /* glsl */`
    attribute float aPhase;
    uniform float uTime;
    uniform float uPixel;
    varying float vAlpha;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      float tw = sin(uTime * 3.0 + aPhase * 6.2831853);
      vAlpha = smoothstep(0.15, 1.0, tw);
      gl_PointSize = (1.8 + 2.6 * tw) * uPixel * (460.0 / max(1.0, -mv.z));

  `,
  fragmentShader: /* glsl */`
    uniform float uOpacity;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vec3(1.0, 0.82, 0.55), a * vAlpha * uOpacity);
    }
  `,
});

{
