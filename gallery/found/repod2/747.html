<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>747 — Three.js structural model</title>
<style>
  body { margin:0; overflow:hidden; background:#0b0e14; font-family:Segoe UI,Arial,sans-serif; }
  #info {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    color:#cfe3ff; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    background:rgba(10,14,22,.65); padding:8px 16px; border-radius:20px;
    border:1px solid rgba(160,190,255,.25); backdrop-filter:blur(4px); pointer-events:none;
  }
  #hint {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    color:#8fa3c4; font-size:12px; background:rgba(10,14,22,.5);
    padding:6px 14px; border-radius:12px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="info">Boeing 747 · structural hull</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 60, 140);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(18, 9, 30);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2.5, 0);

// ---- lighting ----
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2018, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(12, 18, 8);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-10, 6, -10);
scene.add(fill);

// ---- grid floor ----
const grid = new THREE.GridHelper(80, 40, 0x3a4a66, 0x1c2638);
scene.add(grid);

// ============================================================
// 747 structural hull — primitives only, no textures
// ============================================================
const plane = new THREE.Group();

const bodyMat   = new THREE.MeshStandardMaterial({ color:0xdfe7f2, roughness:0.55, metalness:0.15 });
const noseMat   = new THREE.MeshStandardMaterial({ color:0xdfe7f2, roughness:0.5 });
const windowMat = new THREE.MeshStandardMaterial({ color:0x0e1624, roughness:0.3, metalness:0.2 });
const glassMat  = new THREE.MeshStandardMaterial({ color:0x78c8ff, roughness:0.15, metalness:0.6, emissive:0x0a1a30, emissiveIntensity:0.4 });
const engineMat = new THREE.MeshStandardMaterial({ color:0x9aa7ba, roughness:0.4, metalness:0.6 });
const stripeMat = new THREE.MeshStandardMaterial({ color:0x274a8c, roughness:0.6 });
const wingMat   = new THREE.MeshStandardMaterial({ color:0xcfd8e6, roughness:0.55, metalness:0.2 });
const tailMat   = new THREE.MeshStandardMaterial({ color:0xc23030, roughness:0.5 });
const gearMat   = new THREE.MeshStandardMaterial({ color:0x6a7686, roughness:0.7, metalness:0.4 });

// ---------- fuselage ----------
const hull = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 24, 48, 1, true), bodyMat);
hull.rotation.z = Math.PI/2;                 // lay along +X
plane.add(hull);

// nose cone (tapered)
const nose = new THREE.Mesh(new THREE.ConeGeometry(2.2, 6, 48, 1, true), noseMat);
nose.rotation.z = -Math.PI/2;
nose.position.x = -15;
plane.add(nose);

// tail taper
const tail = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4, 48, 1, true), bodyMat);
tail.rotation.z = -Math.PI/2;
tail.position.x = 14;
plane.add(tail);

// nose cap solid
const cap = new THREE.Mesh(new THREE.SphereGeometry(2.2, 32, 16), noseMat);
cap.position.x = -15;
plane.add(cap);

// ---------- fuselage cheatline stripe ----------
const stripe = new THREE.Mesh(new THREE.CylinderGeometry(2.32, 2.32, 24.2, 48, 1, true), stripeMat);
stripe.rotation.z = Math.PI/2;
plane.add(stripe);

// ---------- passenger windows (two rows of tiny discs) ----------
const winGeo = new THREE.CircleGeometry(0.28, 16);
for (let x = -13; x <= 12; x += 1.1) {
  for (const side of [1, -1]) {
    const w = new THREE.Mesh(winGeo, windowMat);
    w.position.set(x, 0.95, side * 2.22);
    w.lookAt(x, 0.95, side * 3.5);
    plane.add(w);
  }
}

// ---------- cockpit windshield ----------
const shield = new THREE.Mesh(new THREE.CircleGeometry(1.7, 24), glassMat);
shield.position.set(-12.2, 1.35, 0);
shield.rotation.y = -Math.PI/2;
plane.add(shield);

// ---------- wings (swept, tapered, via stacked boxes) ----------
function makeWing(len, rootChord, tipChord, x) {
  const grp = new THREE.Group();
  const segs = 8;
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    const chord = THREE.MathUtils.lerp(rootChord, tipChord, t);
    const span = len / segs;
    const m = new THREE.Mesh(new THREE.BoxGeometry(chord, 0.2, span), wingMat);
    m.position.set(-chord/2, 0, span/2 + i*span);   // stagger back for sweep
    grp.add(m);
  }
  grp.position.set(x, 0.4, 0);
  return grp;
}
const wingL = makeWing(9, 5.2, 1.4, 0.5);
wingL.rotation.x = 0.05;
const wingR = wingL.clone();
wingR.scale.z = -1;
wingR.rotation.y = 0.1;
plane.add(wingL, wingR);

// ---------- engine pods (4) ----------
function makeEngine(x, z) {
  const pod = new THREE.Group();
  const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.9, 2.6, 32), engineMat);
  nacelle.rotation.y = Math.PI/2;
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.14, 12, 32), engineMat);
  lip.position.z = 1.35;
  lip.rotation.y = Math.PI/2;
  pod.add(nacelle, lip);
  pod.position.set(x, -0.2, z);
  return pod;
}
plane.add(makeEngine(1.5, 6.6));
plane.add(makeEngine(1.5, -6.6));
plane.add(makeEngine(5.5, 5.2));
plane.add(makeEngine(5.5, -5.2));

// ---------- horizontal stabilizer ----------
const hstab = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.16, 0.14), bodyMat);
hstab.position.set(13, 0.6, 0);
plane.add(hstab);

// ---------- vertical stabilizer (tail fin) ----------
const finGeo = new THREE.ConeGeometry(2.6, 7.5, 4, 1, true);
const finMesh = new THREE.Mesh(finGeo, tailMat);
finMesh.scale.set(0.16, 1, 1);         // flatten into thin swept fin
finMesh.position.set(13.2, 4.6, 0);
finMesh.rotation.y = -Math.PI/4;
plane.add(finMesh);

// small tail cone cap
const tailCone = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2, 32), bodyMat);
tailCone.rotation.z = Math.PI/2;
tailCone.position.x = 15.2;
plane.add(tailCone);

plane.position.y = 3.2;
scene.add(plane);

// ---------- landing gear (structural struts) ----------
function makeGear(x, z, y) {
  const g = new THREE.Group();
  const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, y, 12), gearMat);
  strut.position.y = y/2;
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.2, 20), windowMat);
  wheel.rotation.x = Math.PI/2;
  wheel.position.y = y - 0.1;
  g.add(strut, wheel);
  g.position.set(x, 0, z);
  return g;
}
scene.add(makeGear(0, 0, 3.2));    // nose
scene.add(makeGear(-4.5, 1.4, 3.2));
scene.add(makeGear(-4.5, -1.4, 3.2));
scene.add(makeGear(5.5, 1.4, 3.2));
scene.add(makeGear(5.5, -1.4, 3.2));

// ---------- animate ----------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
