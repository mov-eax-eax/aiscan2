<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boeing 747-400 — Ultra-Detailed Procedural Model (Three.js)</title>
<style>
  :root{
    --bg:#070b12; --panel:rgba(10,16,26,.72); --line:rgba(120,170,230,.18);
    --txt:#dbe7f5; --dim:#8ba4c0; --accent:#4da3ff; --accent2:#ffb020;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas{display:block}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.45);user-select:none;z-index:10}
  #title{top:16px;left:16px;padding:14px 18px 12px;max-width:330px}
  #title h1{margin:0;font-size:17px;font-weight:800;letter-spacing:2.4px;color:#fff;text-transform:uppercase}
  #title h1 b{color:var(--accent);font-weight:800}
  #title .sub{margin-top:5px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  #title .specs{margin-top:10px;font-size:11px;line-height:1.55;color:#a9c2dc;
    display:grid;grid-template-columns:auto auto;gap:0 14px;font-variant-numeric:tabular-nums}
  #title .specs span:nth-child(odd){color:#6f8dab}
  #panel{top:16px;right:16px;padding:12px 14px;width:212px}
  #panel .hdr{font-size:10px;letter-spacing:1.6px;color:#6f8dab;text-transform:uppercase;margin:2px 0 8px}
  .btn{display:block;width:100%;margin:5px 0;padding:8px 10px;font:600 12px/1.2 "Segoe UI",sans-serif;
    color:#cfe0f2;background:rgba(255,255,255,.055);border:1px solid rgba(140,180,220,.18);
    border-radius:8px;cursor:pointer;text-align:left;transition:.16s;letter-spacing:.3px}
  .btn:hover{background:rgba(120,180,255,.16);border-color:rgba(120,180,255,.4);color:#fff}
  .btn.on{background:linear-gradient(180deg,#2f6db0,#235a97);border-color:#4b8fd6;color:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .row .btn{margin:5px 0 0}
  #hud{bottom:16px;left:16px;padding:10px 14px;font-size:11.5px;line-height:1.6;color:#a9c2dc;
    font-variant-numeric:tabular-nums}
  #hud b{color:#fff;font-weight:600}
  #hud .k{color:#6f8dab}
  #tip{bottom:16px;left:50%;transform:translateX(-50%);padding:7px 16px;font-size:11.5px;color:#8ba4c0;
    border-radius:20px;letter-spacing:.4px}
  #tip b{color:#cfe0f2;font-weight:600}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070b12;z-index:50;font-size:12px;letter-spacing:3px;color:#4da3ff;text-transform:uppercase;
    transition:opacity .5s}
  @media (max-width:820px){#title{max-width:210px}#title .specs{display:none}#panel{width:172px}}
</style>
</head>
<body>
<div id="loader">building 747-400 …</div>

<div id="title" class="panel">
  <h1>Boeing <b>747</b>-400</h1>
  <div class="sub">Procedural lofted airframe — compound double-bubble fuselage, NACA-profile swept wing, 18-wheel gear.</div>
  <div class="specs" id="specs"></div>
</div>

<div id="panel" class="panel">
  <div class="hdr">Systems</div>
  <button class="btn" id="btn-gear">Landing gear: down</button>
  <button class="btn" id="btn-engines">Engines: running</button>
  <button class="btn" id="btn-livery">Livery: house</button>
  <div class="hdr" style="margin-top:12px">View</div>
  <div class="row">
    <button class="btn" data-view="hero">Hero</button>
    <button class="btn" data-view="front">Front</button>
    <button class="btn" data-view="side">Side</button>
    <button class="btn" data-view="top">Plan</button>
    <button class="btn" data-view="wing">Wing</button>
    <button class="btn" data-view="engine">Engine</button>
    <button class="btn" data-view="gear">Gear</button>
    <button class="btn" data-view="tail">Tail</button>
  </div>
  <div class="hdr" style="margin-top:12px">Display</div>
  <button class="btn" id="btn-wire">Wireframe: off</button>
  <button class="btn on" id="btn-spin">Auto-orbit: on</button>
</div>

<div id="hud" class="panel">
  <div><span class="k">tris</span> <b id="h-tris">—</b> &nbsp; <span class="k">fps</span> <b id="h-fps">—</b></div>
  <div><span class="k">span</span> <b>64.44 m</b> &nbsp; <span class="k">length</span> <b>70.66 m</b> &nbsp; <span class="k">height</span> <b>19.41 m</b></div>
</div>

<div id="tip" class="panel"><b>drag</b> orbit · <b>wheel</b> zoom · <b>right-drag</b> pan</div>
