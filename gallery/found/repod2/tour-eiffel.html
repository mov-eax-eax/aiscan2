<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Tour Eiffel &mdash; Paris, Champ de Mars (Three.js + GLSL)</title>
<style>
  :root { --amber:#f2c078; --ink:#0a0d12; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070c; }
  body { font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif; color:#e8eef6; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .panel {
    position:fixed; z-index:10; background:rgba(8,11,17,.60); border:1px solid rgba(255,255,255,.10);
    border-radius:14px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  #hud { top:14px; left:14px; padding:11px 12px 10px; max-width:236px; }
  #hud h1 { font-size:12.5px; letter-spacing:3px; font-weight:800; text-transform:uppercase; color:#fff; }
  #hud .sub { margin-top:2px; font-size:9.5px; color:#8b9cb0; line-height:1.35; }
  #hud.min .row, #hud.min .sub { display:none; }
  .row { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .row .lbl { width:100%; font-size:8px; letter-spacing:1.4px; text-transform:uppercase; color:#78899d; margin-bottom:-1px; }
  button {
    font:600 10.5px/1 "Segoe UI", Arial, sans-serif; color:#ccd7e4; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.13); border-radius:7px; padding:5px 8px; cursor:pointer;
    letter-spacing:.3px; transition:background .15s, color .15s, border-color .15s;
  }
  button:hover { background:rgba(255,255,255,.14); color:#fff; }
  button.on { background:var(--amber); border-color:var(--amber); color:#171008; font-weight:700; }
  #stats { right:16px; top:16px; padding:9px 12px; font:11px/1.6 ui-monospace, Consolas, monospace; color:#9fb2c6; }
  #stats b { color:#fff; font-weight:600; }
  #loading {
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:#05070c; transition:opacity .8s ease; font-size:12px; letter-spacing:3px;
    text-transform:uppercase; color:#8fa2b6;
  }
  #loading.gone { opacity:0; pointer-events:none; }
  #bar { width:190px; height:2px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:var(--amber); transition:width .25s ease; }
  #err { position:fixed; left:16px; bottom:16px; z-index:60; max-width:60%; font:11px/1.5 ui-monospace, monospace;
         color:#ff9b9b; background:rgba(30,6,6,.8); border:1px solid #6d2020; border-radius:8px; padding:8px 10px; display:none; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="panel">
  <h1 id="title">Tour Eiffel</h1>
  <div class="sub">Champ de Mars &middot; Paris VII<sup>e</sup><br>Procedural lattice &middot; custom GLSL</div>
  <div class="row" id="views"><div class="lbl">Camera</div></div>
  <div class="row" id="times"><div class="lbl">Time of day</div></div>
  <div class="row" id="opts"><div class="lbl">Options</div></div>
</div>

<div id="stats" class="panel"></div>
<div id="err"></div>
<div id="loading"><div>Building Paris</div><div id="bar"><i></i></div></div>

float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
