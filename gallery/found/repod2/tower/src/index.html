<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Tour Eiffel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 18px; top: 18px; z-index: 10;
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    color: #f2f5f8; background: rgba(14, 20, 28, 0.55);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 12px;
    padding: 14px 16px 12px; max-width: 262px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
    user-select: none;
  }
  #hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  #hud p { margin: 0 0 11px; font-size: 11.5px; color: #a9b6c4; }
  #profiles { display: flex; gap: 6px; margin-bottom: 10px; }
  #profiles button {
    flex: 1; font: inherit; font-size: 11.5px; color: #d7e0ea; cursor: pointer;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px; padding: 6px 4px; transition: background 0.15s, color 0.15s;
  }
  #profiles button:hover { background: rgba(255, 255, 255, 0.14); }
  #profiles button.on { background: #d9b463; border-color: #d9b463; color: #241a06; font-weight: 600; }
  #views { display: flex; flex-wrap: wrap; gap: 6px; }
  #views button {
    font: inherit; font-size: 11.5px; color: #d7e0ea; cursor: pointer;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px; padding: 5px 10px; transition: background 0.15s, color 0.15s;
  }
  #views button:hover { background: rgba(255, 255, 255, 0.14); }
  #views button.on { background: #d9b463; border-color: #d9b463; color: #241a06; font-weight: 600; }
  #hint { margin: 10px 0 0; font-size: 10.5px; color: #8d9aa8; cursor: pointer; }
  #hud.mini p, #hud.mini #hint { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>La Tour Eiffel</h1>
  <p id="note">the real tower &mdash; Plate I, 1900 &middot; 2.59 : 1</p>
  <div id="profiles"></div>
  <div id="views"></div>
  <div id="hint">drag to orbit &middot; scroll to zoom</div>
</div>
<script>/*__APP__*/</script>
</body>
</html>
