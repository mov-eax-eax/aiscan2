<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber City - Three.js Experience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #hud {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #ff00ff;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255,0,255,0.3);
        }
        #hud h2 {
            color: #ff00ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff00ff;
            font-size: 16px;
        }
        #hud .stat {
            color: #00ffff;
            font-size: 14px;
            margin: 4px 0;
        }
        #hud .stat span {
            color: #ffff00;
        }
        #controls-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 13px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            max-width: 260px;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        #controls-hint h3 {
            margin-bottom: 10px;
            color: #ff00ff;
            font-size: 15px;
            text-shadow: 0 0 8px #ff00ff;
        }
        #controls-hint p { margin: 5px 0; line-height: 1.4; }
        #controls-hint kbd {
            background: rgba(0,255,255,0.2);
            border: 1px solid #00ffff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        #reset-view-btn {
            position: fixed;
            top: 20px;
            left: 295px;
            padding: 10px 18px;
            background: linear-gradient(180deg, #ff00ff 0%, #880088 100%);
            border: none;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            z-index: 100;
            transition: all 0.3s ease;
        }
        #reset-view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff00ff;
        }
        .cyber-text {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #ff00ff;
            font-size: 12px;
            opacity: 0.6;
            text-shadow: 0 0 5px #ff00ff;
        }
        #power-meter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid #00ffff;
            padding: 8px 20px;
            border-radius: 20px;
            z-index: 100;
            color: #00ffff;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        #power-meter .bar {
            display: inline-block;
            width: 100px;
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            margin-left: 10px;
            vertical-align: middle;
            overflow: hidden;
        }
        #power-meter .fill {
            height: 100%;
            width: 87%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls-hint">
        <h3>NEON CITY CONTROLS</h3>
        <p><kbd>Left Click + Drag</kbd> Rotate view</p>
        <p><kbd>Scroll Wheel</kbd> Zoom in/out</p>
        <p><kbd>Right Click + Drag</kbd> Pan view</p>
        <p><kbd>Reset View</kbd> Reset camera</p>
    </div>

    <button id="reset-view-btn">RESET VIEW</button>

    <div id="hud">
        <h2>NEON CITY</h2>
        <div class="stat">GRID POWER: <span id="power-level">87%</span></div>
        <div class="stat">TRAFFIC: <span id="traffic-count">0</span> units</div>
        <div class="stat">SIGNAL: <span id="signal-strength">STRONG</span></div>
    </div>

    <div id="power-meter">
        CITY GRID <span class="bar"><span class="fill" id="grid-fill"></span></span>
    </div>

    <div class="cyber-text">// SYSTEM ACTIVE // v2.0.4 //</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let cityGroup;
        let animatedObjects = [];
        let trafficCount = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(60, 40, 60);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.minDistance = 15;
            controls.maxDistance = 200;

            const ambientLight = new THREE.AmbientLight(0x222244, 0.6);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x6666ff, 0.8);
            moonLight.position.set(-30, 80, -30);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            scene.add(moonLight);

            const lights = [
                { color: 0xff00ff, position: [0, 40, 0], intensity: 2.5 },
                { color: 0x00ffff, position: [-50, 20, -50], intensity: 2 },
                { color: 0xffff00, position: [50, 20, 50], intensity: 2 },
                { color: 0x00aaff, position: [-50, 20, 50], intensity: 2 },
                { color: 0xff5500, position: [50, 20, -50], intensity: 2 }
            ];

            lights.forEach(light => {
                const pl = new THREE.PointLight(light.color, light.intensity, 200);
                pl.position.set(...light.position);
                scene.add(pl);
            });

            createCity();
            createGround();
            createAtmosphere();

            animate();
            updateHUD();
        }

        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(300, 300, 60, 60);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a1a,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(300, 60, 0x00ffff, 0x00ffff);
            gridHelper.position.y = 0.2;
            gridHelper.material.opacity = 0.25;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            const glowGrid = new THREE.GridHelper(300, 60, 0xff00ff, 0xff00ff);
            glowGrid.position.y = 0.1;
            glowGrid.material.opacity = 0.1;
            glowGrid.material.transparent = true;
            scene.add(glowGrid);

            for (let i = 0; i < 30; i++) {
                const roadGeometry = new THREE.PlaneGeometry(4, 300);
                const roadMaterial = new THREE.MeshStandardMaterial({
                    color: 0x111122,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const road = new THREE.Mesh(roadGeometry, roadMaterial);
                road.rotation.x = -Math.PI / 2;
                road.position.set(-145 + i * 10, 0.05, 0);
                scene.add(road);
            }

            for (let i = 0; i < 30; i++) {
                const roadGeometry = new THREE.PlaneGeometry(300, 4);
                const roadMaterial = new THREE.MeshStandardMaterial({
                    color: 0x111122,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const road = new THREE.Mesh(roadGeometry, roadMaterial);
                road.rotation.x = -Math.PI / 2;
                road.position.set(0, 0.05, -145 + i * 10);
                scene.add(road);
            }
        }

        function createAtmosphere() {
            const starsGeometry = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 600;
                positions[i + 1] = Math.random() * 300 + 50;
                positions[i + 2] = (Math.random() - 0.5) * 600;

                const c = Math.random();
                colors[i] = c > 0.7 ? 1 : 0.7;
                colors[i + 1] = c > 0.5 ? 0.8 : 0.3;
                colors[i + 2] = 1;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const starsMaterial = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            const rainCount = 2000;
            const rainGeometry = new THREE.BufferGeometry();
            const rainPos = new Float32Array(rainCount * 3);
            for (let i = 0; i < rainCount * 3; i += 3) {
                rainPos[i] = (Math.random() - 0.5) * 300;
                rainPos[i + 1] = Math.random() * 100;
                rainPos[i + 2] = (Math.random() - 0.5) * 300;
            }
            rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
            const rainMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.3,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            const rain = new THREE.Points(rainGeometry, rainMaterial);
            rain.userData = { speed: 0.5 };
            scene.add(rain);
            animatedObjects.push(rain);
        }

        function createCity() {
            cityGroup = new THREE.Group();

            createMegaTower();
            createSkyscrapers();
            createNeonSigns();
            createFlyingCars();
            createDataSpires();
            createHoloParks();
            createTransitRings();
            createPowerPlant();

            scene.add(cityGroup);
        }

        function createCustomGeometry(type, params) {
            let geometry;
            switch(type) {
                case 'hexagon':
                    geometry = createHexagonGeometry(params.radius, params.height);
                    break;
                case 'torusknot':
                    geometry = new THREE.TorusKnotGeometry(params.radius, params.tube, params.tubularSegments, params.radialSegments);
                    break;
                case 'icosahedron':
                    geometry = new THREE.IcosahedronGeometry(params.radius, params.detail);
                    break;
                case 'octahedron':
                    geometry = new THREE.OctahedronGeometry(params.radius, params.detail);
                    break;
                case 'customTower':
                    geometry = createTowerGeometry(params.radius, params.height, params.segments);
                    break;
                case 'customArch':
                    geometry = createArchGeometry(params.radius, params.height, params.width);
                    break;
                case 'customDiamond':
                    geometry = createDiamondGeometry(params.radius, params.height);
                    break;
                case 'customRing':
                    geometry = createRingGeometry(params.innerRadius, params.outerRadius, params.segments);
                    break;
                case 'customCrown':
                    geometry = createCrownGeometry(params.radius, params.points, params.height);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(1, 1, 1);
            }
            return geometry;
        }

        function createHexagonGeometry(radius, height) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];
            const sides = 6;

            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2;
                verts.push(Math.cos(a) * radius, 0, Math.sin(a) * radius);
            }
            verts.push(0, 0, 0);
            const cIdx = sides;

            for (let i = 0; i < sides; i++) {
                const next = (i + 1) % sides;
                indices.push(i, next, cIdx);
            }

            const topOffset = verts.length / 3;
            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2;
                verts.push(Math.cos(a) * radius, height, Math.sin(a) * radius);
            }
            verts.push(0, height, 0);
            const tIdx = topOffset + sides;

            for (let i = 0; i < sides; i++) {
                const next = (i + 1) % sides;
                indices.push(topOffset + i, tIdx, topOffset + next);
                indices.push(i, next, topOffset + next);
                indices.push(i, topOffset + next, topOffset + i);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createTowerGeometry(radius, height, segments) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const r = radius * (1 - t * 0.5);
                const y = t * height;
                for (let j = 0; j <= 12; j++) {
                    const a = (j / 12) * Math.PI * 2;
                    verts.push(Math.cos(a) * r, y, Math.sin(a) * r);
                }
            }

            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < 12; j++) {
                    const a = i * 13 + j;
                    const b = a + 13;
                    indices.push(a, b, a + 1);
                    indices.push(b, b + 1, a + 1);
                }
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createArchGeometry(radius, height, width) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];

            for (let i = 0; i <= 20; i++) {
                const t = i / 20;
                const a = t * Math.PI;
                const x = Math.cos(a) * radius;
                const y = Math.sin(a) * height + height;
                verts.push(x - width / 2, y, 0);
                verts.push(x + width / 2, y, 0);
            }

            for (let i = 0; i < 20; i++) {
                const b = i * 2;
                indices.push(b, b + 1, b + 3);
                indices.push(b, b + 3, b + 2);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createDiamondGeometry(radius, height) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];

            verts.push(0, height, 0);
            verts.push(0, -height, 0);

            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const a = (i / midCount) * Math.PI * 2;
                verts.push(Math.cos(a) * radius, 0, Math.sin(a) * radius);
            }

            const top = 0;
            const bot = 1;
            for (let i = 0; i < midCount; i++) {
                const next = (i + 1) % midCount;
                indices.push(top, 2 + i, 2 + next);
                indices.push(bot, 2 + next, 2 + i);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createRingGeometry(innerRadius, outerRadius, segments) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];

            for (let i = 0; i <= segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                verts.push(Math.cos(a) * innerRadius, 0, Math.sin(a) * innerRadius);
                verts.push(Math.cos(a) * outerRadius, 0, Math.sin(a) * outerRadius);
            }

            for (let i = 0; i < segments; i++) {
                const b = i * 2;
                indices.push(b, b + 1, b + 3);
                indices.push(b, b + 3, b + 2);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createCrownGeometry(radius, points, height) {
            const geo = new THREE.BufferGeometry();
            const verts = [];
            const indices = [];
            const total = points * 2;

            for (let i = 0; i < total; i++) {
                const r = i % 2 === 0 ? radius : radius * 0.5;
                const a = (i / total) * Math.PI * 2;
                verts.push(Math.cos(a) * r, 0, Math.sin(a) * r);
            }
            verts.push(0, height, 0);
            const center = total;

            for (let i = 0; i < total; i++) {
                const next = (i + 1) % total;
                indices.push(i, next, center);
            }

            const lowerCenter = total + 1;
            verts.push(0, -height * 0.3, 0);
            for (let i = 0; i < total; i++) {
                const next = (i + 1) % total;
                indices.push(i, lowerCenter, next);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        function createMegaTower() {
            const group = new THREE.Group();

            const towerGeo = createCustomGeometry('customTower', { radius: 6, height: 35, segments: 30 });
            const towerMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a3a,
                metalness: 0.8,
                roughness: 0.3,
                emissive: 0x222244,
                emissiveIntensity: 0.2
            });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.castShadow = true;
            group.add(tower);

            for (let i = 0; i < 8; i++) {
                const ringGeo = createCustomGeometry('customRing', { innerRadius: 5 + i * 0.5, outerRadius: 7 + i * 0.5, segments: 32 });
                const ringMat = new THREE.MeshStandardMaterial({
                    color: i % 2 === 0 ? 0xff00ff : 0x00ffff,
                    emissive: i % 2 === 0 ? 0xff00ff : 0x00ffff,
                    emissiveIntensity: 0.8,
                    transparent: true,
                    opacity: 0.7,
                    metalness: 0.5,
                    roughness: 0.2
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.rotation.z = i * 0.3;
                ring.position.y = 4 + i * 4;
                ring.userData = { rotSpeed: 0.005 + i * 0.002 };
                group.add(ring);
                animatedObjects.push(ring);
            }

            const topGeo = createCustomGeometry('diamond', { radius: 4, height: 6 });
            const topMat = new THREE.MeshStandardMaterial({
                color: 0xff00ff,
                emissive: 0xff00ff,
                emissiveIntensity: 1,
                metalness: 0.9,
                roughness: 0.1,
                transparent: true,
                opacity: 0.9
            });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 38;
            group.add(top);

            const beamGeo = new THREE.CylinderGeometry(0.3, 0.3, 50, 8);
            const beamMat = new THREE.MeshStandardMaterial({
                color: 0xff00ff,
                emissive: 0xff00ff,
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.3
            });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.y = 60;
            group.add(beam);

            const glowGeo = new THREE.SphereGeometry(2, 16, 16);
            const glowMat = new THREE.MeshStandardMaterial({
                color: 0xff00ff,
                emissive: 0xff00ff,
                emissiveIntensity: 3,
                transparent: true,
                opacity: 0.5
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.y = 40;
            glow.userData = { pulse: true };
            group.add(glow);
            animatedObjects.push(glow);

            cityGroup.add(group);
        }

        function createSkyscrapers() {
            const positions = [];
            const buildingCount = 45;

            for (let i = 0; i < buildingCount; i++) {
                let x, z, valid;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * 120;
                    z = (Math.random() - 0.5) * 120;
                    valid = true;
                    if (Math.abs(x) < 15 && Math.abs(z) < 15) valid = false;
                    for (const p of positions) {
                        if (Math.abs(x - p.x) < 6 && Math.abs(z - p.z) < 6) valid = false;
                    }
                    attempts++;
                } while (!valid && attempts < 20);

                if (!valid) continue;
                positions.push({ x, z });

                const group = new THREE.Group();
                const h = 5 + Math.random() * 25;
                const w = 2 + Math.random() * 3;
                const d = 2 + Math.random() * 3;

                const buildingGeo = new THREE.BoxGeometry(w, h, d);
                const buildingMat = new THREE.MeshStandardMaterial({
                    color: 0x222244,
                    metalness: 0.7,
                    roughness: 0.4,
                    emissive: 0x111122,
                    emissiveIntensity: 0.1
                });
                const building = new THREE.Mesh(buildingGeo, buildingMat);
                building.position.y = h / 2;
                building.castShadow = true;
                group.add(building);

                const winMat = new THREE.MeshStandardMaterial({
                    color: 0xffff88,
                    emissive: 0xffff88,
                    emissiveIntensity: 0.5
                });
                const winCount = Math.floor(Math.random() * 8) + 4;
                for (let j = 0; j < winCount; j++) {
                    const wy = 1 + Math.random() * (h - 2);
                    const wx = (Math.random() - 0.5) * (w - 0.5);
                    const wz = (Math.random() > 0.5 ? 1 : -1) * d / 2 + 0.01;
                    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), winMat);
                    win.position.set(wx, wy, wz);
                    if (wz > 0) win.rotation.y = Math.PI;
                    group.add(win);
                }

                const color = [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff, 0xff5500][Math.floor(Math.random() * 5)];
                const stripeMat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.6,
                    transparent: true,
                    opacity: 0.15
                });
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(w * 1.1, 0.5, d * 1.1), stripeMat);
                stripe.position.y = h;
                group.add(stripe);

                group.position.set(x, 0, z);
                cityGroup.add(group);
            }
        }

        function createNeonSigns() {
            const messages = [
                'NEON', 'CYBER', 'GRID', 'VOID', 'DREAM', 'WAVE',
                'PULSE', 'ECHO', 'NOVA', 'FLUX', 'CORE', 'EDGE'
            ];
            const colors = [0xff00ff, 0x00ffff, 0xffff00, 0x00aaff, 0xff5500];

            for (let i = 0; i < 12; i++) {
                const group = new THREE.Group();
                const color = colors[i % colors.length];

                const bgMat = new THREE.MeshStandardMaterial({
                    color: 0x000000,
                    emissive: color,
                    emissiveIntensity: 0.1,
                    transparent: true,
                    opacity: 0.3
                });
                const bg = new THREE.Mesh(new THREE.PlaneGeometry(5, 2), bgMat);
                group.add(bg);

                const borderMat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 1,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
                const border = new THREE.Mesh(new THREE.EdgesGeometry(new THREE.PlaneGeometry(5, 2)), borderMat);
                group.add(border);

                const dotMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: color,
                    emissiveIntensity: 2
                });
                for (let j = 0; j < 8; j++) {
                    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), dotMat);
                    dot.position.set(-2 + j * 0.57, 0.6, 0.01);
                    group.add(dot);
                }

                const angle = (i / 12) * Math.PI * 2;
                const radius = 25 + Math.random() * 20;
                group.position.set(
                    Math.cos(angle) * radius,
                    15 + Math.random() * 15,
                    Math.sin(angle) * radius
                );
                group.lookAt(0, group.position.y, 0);
                group.userData = { flickerSpeed: 0.5 + Math.random() };
                cityGroup.add(group);
                animatedObjects.push(group);
            }
        }

        function createFlyingCars() {
            for (let i = 0; i < 15; i++) {
                const carGroup = new THREE.Group();

                const bodyGeo = new THREE.BoxGeometry(1.2, 0.4, 2);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x444466,
                    metalness: 0.9,
                    roughness: 0.1,
                    emissive: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][i % 4],
                    emissiveIntensity: 0.3
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                carGroup.add(body);

                const cabinGeo = new THREE.BoxGeometry(0.8, 0.3, 1.2);
                const cabinMat = new THREE.MeshStandardMaterial({
                    color: 0x88aaff,
                    transparent: true,
                    opacity: 0.5,
                    emissive: 0x00ffff,
                    emissiveIntensity: 0.1
                });
                const cabin = new THREE.Mesh(cabinGeo, cabinMat);
                cabin.position.y = 0.35;
                carGroup.add(cabin);

                const glowMat = new THREE.MeshStandardMaterial({
                    color: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][i % 4],
                    emissive: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][i % 4],
                    emissiveIntensity: 2,
                    transparent: true,
                    opacity: 0.5
                });
                for (let j = 0; j < 4; j++) {
                    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), glowMat);
                    glow.position.set(
                        (j % 2 === 0 ? -1 : 1) * 0.5,
                        -0.15,
                        (j < 2 ? -1 : 1) * 0.8
                    );
                    carGroup.add(glow);
                }

                const trailMat = new THREE.MeshStandardMaterial({
                    color: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][i % 4],
                    emissive: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][i % 4],
                    emissiveIntensity: 3,
                    transparent: true,
                    opacity: 0.3
                });
                const trail = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), trailMat);
                trail.position.z = -1.2;
                carGroup.add(trail);

                const radius = 15 + Math.random() * 40;
                const angle = Math.random() * Math.PI * 2;
                const height = 8 + Math.random() * 25;

                carGroup.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );

                carGroup.userData = {
                    radius: radius,
                    angle: angle,
                    height: height,
                    speed: 0.002 + Math.random() * 0.003,
                    ySpeed: 0.001 + Math.random() * 0.002,
                    yOffset: Math.random() * Math.PI * 2,
                    trail: trail
                };

                cityGroup.add(carGroup);
                animatedObjects.push(carGroup);
                trafficCount++;
            }
        }

        function createDataSpires() {
            const spirePositions = [
                { x: -30, z: -30 }, { x: 30, z: -30 },
                { x: -30, z: 30 }, { x: 30, z: 30 },
                { x: -45, z: 0 }, { x: 45, z: 0 },
                { x: 0, z: -45 }, { x: 0, z: 45 }
            ];

            spirePositions.forEach((pos, index) => {
                const group = new THREE.Group();

                const h = 15 + Math.random() * 10;
                const geo = createCustomGeometry('customTower', { radius: 1.5, height: h, segments: 12 });
                const mat = new THREE.MeshStandardMaterial({
                    color: [0xff00ff, 0x00ffff, 0xffff00, 0x00aaff, 0xff5500, 0x00ff88, 0xff0088, 0x88ff00][index],
                    emissive: [0xff00ff, 0x00ffff, 0xffff00, 0x00aaff, 0xff5500, 0x00ff88, 0xff0088, 0x88ff00][index],
                    emissiveIntensity: 0.4,
                    metalness: 0.6,
                    roughness: 0.3,
                    transparent: true,
                    opacity: 0.8
                });
                const spire = new THREE.Mesh(geo, mat);
                spire.position.y = h / 2;
                spire.castShadow = true;
                group.add(spire);

                const ringGeo = createCustomGeometry('customRing', { innerRadius: 2.5, outerRadius: 3, segments: 24 });
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: [0xff00ff, 0x00ffff, 0xffff00, 0x00aaff, 0xff5500, 0x00ff88, 0xff0088, 0x88ff00][index],
                    emissiveIntensity: 1,
                    transparent: true,
                    opacity: 0.6
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = h - 2;
                ring.userData = { rotSpeed: 0.02 + index * 0.003 };
                group.add(ring);
                animatedObjects.push(ring);

                const top = new THREE.Mesh(
                    new THREE.OctahedronGeometry(1, 0),
                    new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        emissive: [0xff00ff, 0x00ffff, 0xffff00, 0x00aaff, 0xff5500, 0x00ff88, 0xff0088, 0x88ff00][index],
                        emissiveIntensity: 2,
                        transparent: true,
                        opacity: 0.7
                    })
                );
                top.position.y = h + 1;
                group.add(top);

                group.position.set(pos.x, 0, pos.z);
                cityGroup.add(group);
            });
        }

        function createHoloParks() {
            const parkPositions = [
                { x: -40, z: -40 }, { x: 40, z: 40 },
                { x: -40, z: 40 }, { x: 40, z: -40 }
            ];

            parkPositions.forEach((pos, index) => {
                const group = new THREE.Group();

                const baseGeo = createCustomGeometry('customRing', { innerRadius: 5, outerRadius: 7, segments: 32 });
                const baseMat = new THREE.MeshStandardMaterial({
                    color: 0x111122,
                    emissive: [0x00ffff, 0xff00ff, 0xffff00, 0x00aaff][index],
                    emissiveIntensity: 0.2,
                    metalness: 0.5,
                    roughness: 0.5
                });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.rotation.x = -Math.PI / 2;
                base.position.y = 0.5;
                group.add(base);

                const treeCount = 5 + Math.floor(Math.random() * 4);
                for (let i = 0; i < treeCount; i++) {
                    const treeGroup = new THREE.Group();
                    const a = (i / treeCount) * Math.PI * 2 + Math.random() * 0.5;
                    const r = 1 + Math.random() * 3;
                    const treeH = 2 + Math.random() * 3;

                    const trunk = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.15, 0.2, treeH, 6),
                        new THREE.MeshStandardMaterial({
                            color: 0x333355,
                            metalness: 0.5,
                            roughness: 0.5
                        })
                    );
                    trunk.position.y = treeH / 2;
                    treeGroup.add(trunk);

                    const canopyGeo = createCustomGeometry('diamond', { radius: 0.8 + Math.random() * 0.5, height: 1 + Math.random() * 0.5 });
                    const canopyMat = new THREE.MeshStandardMaterial({
                        color: [0x00ffff, 0xff00ff, 0xffff00][i % 3],
                        emissive: [0x00ffff, 0xff00ff, 0xffff00][i % 3],
                        emissiveIntensity: 0.6,
                        transparent: true,
                        opacity: 0.7
                    });
                    const canopy = new THREE.Mesh(canopyGeo, canopyMat);
                    canopy.position.y = treeH + 0.5;
                    treeGroup.add(canopy);

                    treeGroup.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
                    treeGroup.scale.setScalar(0.6 + Math.random() * 0.4);
                    group.add(treeGroup);
                }

                group.position.set(pos.x, 0, pos.z);
                cityGroup.add(group);
            });
        }

        function createTransitRings() {
            const group = new THREE.Group();

            for (let ring = 0; ring < 3; ring++) {
                const r = 18 + ring * 6;
                const ringGeo = createCustomGeometry('customRing', {
                    innerRadius: r - 0.3,
                    outerRadius: r + 0.3,
                    segments: 48
                });
                const ringMat = new THREE.MeshStandardMaterial({
                    color: [0x00ffff, 0xff00ff, 0xffff00][ring],
                    emissive: [0x00ffff, 0xff00ff, 0xffff00][ring],
                    emissiveIntensity: 1,
                    transparent: true,
                    opacity: 0.3 * (ring + 1),
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(ringGeo, ringMat);
                mesh.rotation.x = Math.PI / 3;
                mesh.rotation.y = ring * 0.5;
                mesh.position.y = 3 + ring * 2;
                mesh.userData = {
                    rotSpeed: 0.003 + ring * 0.002,
                    axis: ring % 2 === 0 ? 'y' : 'x'
                };
                group.add(mesh);
                animatedObjects.push(mesh);
            }

            group.position.set(0, 0, 0);
            cityGroup.add(group);
        }

        function createPowerPlant() {
            const group = new THREE.Group();

            const reactorGeo = createCustomGeometry('icosahedron', { radius: 4, detail: 1 });
            const reactorMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 1,
                metalness: 0.8,
                roughness: 0.2,
                transparent: true,
                opacity: 0.7
            });
            const reactor = new THREE.Mesh(reactorGeo, reactorMat);
            reactor.position.y = 5;
            reactor.castShadow = true;
            reactor.userData = { pulse: true, baseScale: 1 };
            group.add(reactor);
            animatedObjects.push(reactor);

            const ringGeo = createCustomGeometry('customRing', { innerRadius: 5, outerRadius: 7, segments: 32 });
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xff00ff,
                emissive: 0xff00ff,
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 3;
            ring.position.y = 5;
            ring.userData = { rotSpeed: 0.01 };
            group.add(ring);
            animatedObjects.push(ring);

            const pillarMat = new THREE.MeshStandardMaterial({
                color: 0x333355,
                metalness: 0.7,
                roughness: 0.3
            });
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.8, 8, 8),
                    pillarMat
                );
                pillar.position.set(Math.cos(a) * 6, 4, Math.sin(a) * 6);
                group.add(pillar);
            }

            group.position.set(50, 0, 50);
            cityGroup.add(group);
        }

        function updateHUD() {
            document.getElementById('traffic-count').textContent = trafficCount;
            const signalColors = ['WEAK', 'MODERATE', 'STRONG', 'MAXIMUM'];
            document.getElementById('signal-strength').textContent =
                signalColors[Math.floor(Math.random() * 4)];
        }

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            animatedObjects.forEach(obj => {
                if (obj.userData && obj.userData.rotSpeed) {
                    if (obj.userData.axis === 'x') {
                        obj.rotation.x += obj.userData.rotSpeed;
                    } else {
                        obj.rotation.y += obj.userData.rotSpeed;
                    }
                }

                if (obj.userData && obj.userData.pulse) {
                    const s = 1 + Math.sin(time * 2) * 0.05;
                    obj.scale.setScalar(s);
                    if (obj.material) {
                        obj.material.emissiveIntensity = 0.8 + Math.sin(time * 2) * 0.4;
                    }
                }

                if (obj.userData && obj.userData.flickerSpeed) {
                    const intensity = 0.5 + Math.sin(time * obj.userData.flickerSpeed * 3) * 0.5;
                    obj.children.forEach(child => {
                        if (child.material) {
                            child.material.opacity = Math.max(0.1, intensity * 0.8);
                        }
                    });
                }

                if (obj.userData && obj.userData.radius !== undefined) {
                    obj.userData.angle += obj.userData.speed;
                    obj.position.x = Math.cos(obj.userData.angle) * obj.userData.radius;
                    obj.position.z = Math.sin(obj.userData.angle) * obj.userData.radius;
                    obj.position.y = obj.userData.height + Math.sin(time * obj.userData.ySpeed * 10 + obj.userData.yOffset) * 2;
                    obj.rotation.y = -obj.userData.angle + Math.PI / 2;
                }

                if (obj.userData && obj.userData.speed !== undefined && obj.userData.radius === undefined && obj.userData.rotSpeed === undefined && obj.userData.pulse === undefined && obj.userData.flickerSpeed === undefined) {
                    const pos = obj.geometry.attributes.position;
                    if (pos) {
                        const array = pos.array;
                        for (let i = 1; i < array.length; i += 3) {
                            array[i] -= obj.userData.speed;
                            if (array[i] < 0) {
                                array[i] = 100;
                                array[i - 1] = (Math.random() - 0.5) * 300;
                                array[i + 1] = (Math.random() - 0.5) * 300;
                            }
                        }
                        pos.needsUpdate = true;
                    }
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        document.getElementById('reset-view-btn').addEventListener('click', () => {
            camera.position.set(60, 40, 60);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
