/* -------------------------------- 6. WING -------------------------------- */
/** NACA-style thickness distribution with the crest moved aft (supercritical feel). */
function airfoilThickness(x, tc) {
  const xs = Math.pow(clamp(x, 0, 1), 1.10);
  const yt = 5 * tc * (0.2969 * Math.sqrt(xs) - 0.1260 * xs - 0.3516 * xs * xs
             + 0.2843 * xs * xs * xs - 0.1015 * xs * xs * xs * xs);
  return Math.max(yt, 0);
}
/** Aft-loaded mean camber line (m = max camber at 45 % chord). */
function airfoilCamber(x, m = 0.021, a = 0.45) {
  if (x < a) return m / (a * a) * (2 * a * x - x * x);
  return m / ((1 - a) * (1 - a)) * ((1 - 2 * a) + 2 * a * x - x * x);
}
/** Closed airfoil loop, normalised chord, returns [[xc, yc], ...] LE -> TE -> LE. */
function airfoilLoop(tc, camber, n = 30) {
  const pts = [];
  const xs = [];
  for (let i = 0; i <= n; i++) xs.push(0.5 - 0.5 * Math.cos(Math.PI * i / n));
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], yt = airfoilThickness(x, tc), yc = airfoilCamber(x, camber);
    pts.push([x, yc + yt]);
  }
  for (let i = xs.length - 2; i >= 1; i--) {
    const x = xs[i], yt = airfoilThickness(x, tc), yc = airfoilCamber(x, camber);
    pts.push([x, yc - yt]);
  }
  return pts;
}

/** Wing planform: returns {chord, xLe, yChord, inc, tc} for a given |z|. */
function wingSection(z) {
  const zb = S.BREAK_Y, sem = S.SEMI;
  let chord, xLe;
  if (z <= zb) {
    chord = lerp(S.ROOT_CHORD, S.BREAK_CHORD, z / zb);
    xLe = S.WING_ROOT_LE_X + z * Math.tan(S.LE_SWEEP_IN);
  } else {
    const t = (z - zb) / (sem - zb);
    chord = lerp(S.BREAK_CHORD, S.TIP_CHORD, t);
    xLe = S.WING_ROOT_LE_X + zb * Math.tan(S.LE_SWEEP_IN) + (z - zb) * Math.tan(S.LE_SWEEP_OUT);
  }
  let tc;
  if (z <= zb) tc = lerp(S.ROOT_T, S.BREAK_T, z / zb);
  else tc = lerp(S.BREAK_T, S.TIP_T, (z - zb) / (sem - zb));
  const inc = S.WING_INCIDENCE + S.WING_TWIST * (z / sem);
  const yChord = S.WING_ROOT_Y + z * Math.tan(S.DIHEDRAL);
  return { chord, xLe, yChord, inc, tc, z };
}

/** World position of a point on a wing section: xc in [0,1] chord, yc in chord units. */
function wingPoint(sec, xc, yc) {
  const c = sec.chord, inc = sec.inc;
  const ci = Math.cos(inc), si = Math.sin(inc);
  const x = sec.xLe + xc * c * ci - yc * c * si;
  const y = sec.yChord + 0.5 * c * si + xc * c * si + yc * c * ci;
  return new THREE.Vector3(x, y, sec.z);
}

const WING_SECTIONS = [0, 1.6, 3.2, 4.8, 6.4, 8.0, 9.6, 11.2, 12.9, 14.6, 16.4, 18.4,
                       20.4, 22.4, 24.4, 26.4, 28.4, 30.4, 32.22];

/** Patch lying on the wing skin: spanwise z0..z1, chordwise xc0..xc1. */
function wingPatchGeo(side, z0, z1, xc0, xc1, upper, offset, nz = 6, nx = 4) {
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= nz; i++) {
    const z = lerp(z0, z1, i / nz);
    const sec = wingSection(z); sec.z = z * side;
    for (let j = 0; j <= nx; j++) {
      const xc = lerp(xc0, xc1, j / nx);
      const yc = (upper ? 1 : -1) * airfoilThickness(xc, sec.tc);
      const p = wingPoint(sec, xc, yc);
      p.y += offset * (upper ? 1 : -1);
      pos.push(p.x, p.y, p.z);
      uvs.push(i / nz, j / nx);
    }
  }
  for (let i = 0; i < nz; i++) for (let j = 0; j < nx; j++) {
    const a = i * (nx + 1) + j, b = a + 1, c = a + nx + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const zm = (z0 + z1) / 2, xm = (xc0 + xc1) / 2;
  const sm = wingSection(zm); sm.z = zm * side;
  const pm = wingPoint(sm, xm, (upper ? 1 : -1) * airfoilThickness(xm, sm.tc));
  orientGeometry(g, new THREE.Vector3(pm.x, pm.y + (upper ? 0.6 : -0.6), pm.z),
                 new THREE.Vector3(0, upper ? 1 : -1, 0));
  g.computeVertexNormals();
  return g;
}
function wingPatch(side, z0, z1, xc0, xc1, upper, offset, mat, nz = 6, nx = 4) {
  return new THREE.Mesh(wingPatchGeo(side, z0, z1, xc0, xc1, upper, offset, nz, nx), mat);
}

/** Spoilers (flush) + flap / aileron hinge lines and panel breaks. */
function buildWingControlSurfaces(side) {
  const grp = new THREE.Group();
  const gapMat = new THREE.MeshBasicMaterial({ color: 0x1b1f24, transparent: true, opacity: 0.9 });
  const spoilerMat = new THREE.MeshPhysicalMaterial({ color: 0xe4e8ec, roughness: 0.48, metalness: 0.02,
    clearcoat: 0.35, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });

  const spoilerGeos = [], gapGeos = [];

  /* six flush spoiler panels per wing */
  const SPOILERS = [[4.2, 7.2], [7.6, 10.6], [11.0, 14.0], [14.4, 17.4], [17.8, 20.8], [21.2, 24.2]];
  for (const [a, b] of SPOILERS) {
    spoilerGeos.push(wingPatchGeo(side, a + 0.10, b - 0.10, 0.585, 0.752, true, 0.006, 4, 4));
    gapGeos.push(wingPatchGeo(side, a, a + 0.10, 0.575, 0.762, true, 0.010, 2, 3));   // LE gap
    gapGeos.push(wingPatchGeo(side, b - 0.10, b, 0.575, 0.762, true, 0.010, 2, 3));   // TE gap
    gapGeos.push(wingPatchGeo(side, a + 0.10, b - 0.10, 0.752, 0.762, true, 0.010, 4, 1));
  }

  /* trailing-edge sections: 3 inboard flap panels + 2 outboard aileron panels */
  const SECTIONS = [[3.6, 10.2], [10.6, 17.2], [17.6, 21.0], [21.6, 26.5], [26.9, 31.4]];
  for (const [a, b] of SECTIONS) {
    for (const upper of [true, false]) {
      gapGeos.push(wingPatchGeo(side, a, b, 0.768, 0.784, upper, 0.008, 8, 1));              // hinge line
      gapGeos.push(wingPatchGeo(side, a - 0.07, a + 0.07, 0.784, 0.985, upper, 0.008, 1, 4)); // panel break
      gapGeos.push(wingPatchGeo(side, b - 0.07, b + 0.07, 0.784, 0.985, upper, 0.008, 1, 4));
    }
  }
  grp.add(new THREE.Mesh(mergeGeometries(spoilerGeos), spoilerMat));
  grp.add(new THREE.Mesh(mergeGeometries(gapGeos), gapMat));
  return grp;
}

/** One wing panel (side = +1 starboard). */
function buildWingPanel(side) {
  const grp = new THREE.Group();
  const nPts = 2 * 30;                         // 61 loop points per section
  const rings = [];
  const secList = [];
  for (const zz of WING_SECTIONS) {
    const sec = wingSection(zz);
    sec.z = zz * side;
    secList.push(sec);
    const camber = lerp(0.022, 0.006, zz / S.SEMI);
    const loop = airfoilLoop(sec.tc, camber, 30);
    const pts = [];
    for (const [xc, yc] of loop) {
      const p = wingPoint(sec, xc, yc);
      pts.push([p.x, p.y, p.z]);
    }
    rings.push(pts);
  }
  // Build the surface manually so that v runs LE -> upper -> TE -> lower -> LE
  const pos = [], uvs = [], idx = [];
  const m = nPts;
  for (let i = 0; i < rings.length; i++) {
    for (let j = 0; j < m; j++) {
      const p = rings[i][j];
      pos.push(p[0], p[1], p[2]);
      uvs.push(WING_SECTIONS[i] / S.SEMI, j / m);
    }
  }
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < m; j++) {
      const a = i * m + j, b = i * m + ((j + 1) % m);
      const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
      if (side > 0) idx.push(a, d, b, b, d, c);
      else idx.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const skin = new THREE.Mesh(g, M.wing);
  grp.add(skin);

  /* ---- wing tip cap ---- */
  const tipSec = wingSection(S.SEMI); tipSec.z = S.SEMI * side;
  const tipPts = [];
  for (const [xc, yc] of airfoilLoop(tipSec.tc, 0.006, 30)) {
    tipPts.push(wingPoint(tipSec, xc, yc));
  }
  const capGeo = new THREE.BufferGeometry();
  const cp = [], cidx = [];
  let cx = 0, cy = 0;
  for (const p of tipPts) { cx += p.x; cy += p.y; }
  cx /= tipPts.length; cy /= tipPts.length;
  cp.push(cx, cy, tipSec.z);
  for (const p of tipPts) cp.push(p.x, p.y, p.z);
  for (let j = 0; j < tipPts.length; j++) {
    const a = 1 + j, b = 1 + ((j + 1) % tipPts.length);
    if (side > 0) cidx.push(0, b, a); else cidx.push(0, a, b);
  }
  capGeo.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3));
  capGeo.setIndex(cidx);
  capGeo.computeVertexNormals();
  orientGeometry(capGeo, new THREE.Vector3(cx, cy, tipSec.z + side * 0.2), new THREE.Vector3(0, 0, side));
  capGeo.computeVertexNormals();
  grp.add(new THREE.Mesh(capGeo, M.wing));

  /* ---- spoilers, flap and aileron definition ---- */
  grp.add(buildWingControlSurfaces(side));

  /* ---- winglet ---- */
  grp.add(buildWinglet(side));

  /* ---- flap-track canoe fairings ---- */
  for (const zf of [6.0, 10.6, 16.2, 21.6]) {
    grp.add(buildFlapFairing(zf, side));
  }

  /* ---- flap hinge / spoiler panel lines are drawn in the wing texture ---- */
  return grp;
}

/** Canted 747-400 winglet. */
function buildWinglet(side) {
  const g = new THREE.Group();
  const tip = wingSection(S.SEMI); tip.z = S.SEMI * side;
  const cant = S.WINGLET_CANT;
  const dir = new THREE.Vector3(0, Math.cos(cant), Math.sin(cant) * side);
  const baseLe = new THREE.Vector3(
    tip.xLe + 0.42, tip.yChord + 0.5 * tip.chord * Math.sin(tip.inc) + 0.42 * tip.chord * Math.sin(tip.inc),
    S.SEMI * side);
  const baseY = tip.yChord + 0.30 * tip.chord * Math.sin(tip.inc);
  baseLe.y = baseY + 0.06;
  const stations = [0, 0.16, 0.34, 0.52, 0.68, 0.80, 0.88, 0.94, 0.985, 1.0];
  const loop = airfoilLoop(0.10, 0.004, 18);
  const rings = [];
  for (const t of stations) {
    const h = S.WINGLET_H * t;
    let c = lerp(S.WINGLET_BASE_C, S.WINGLET_TIP_C, Math.pow(t, 0.92));
    /* round the tip off so it is not a flat slab */
    c *= Math.sqrt(Math.max(0.02, 1 - Math.pow(smoothstep((t - 0.80) / 0.20), 2)));
    const sweep = 0.62 * S.WINGLET_H * Math.pow(t, 1.25);   // LE sweeps aft going up
    const org = new THREE.Vector3(
      baseLe.x + sweep,
      baseLe.y + dir.y * h,
      baseLe.z + dir.z * h);
    const pts = [];
    const inc = 0.02;
    for (const [xc, yc] of loop) {
      const px = org.x + xc * c * Math.cos(inc) - yc * c * Math.sin(inc);
      const py = org.y + xc * c * Math.sin(inc) + yc * c * Math.cos(inc);
      pts.push([px, py, org.z]);
    }
    rings.push(pts);
  }
  const pos = [], uvs = [], idx = [];
  const m = rings[0].length;
  for (let i = 0; i < rings.length; i++) for (let j = 0; j < m; j++) {
    pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
    uvs.push(stations[i], j / m);
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < m; j++) {
    const a = i * m + j, b = i * m + ((j + 1) % m);
    const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
    if (side > 0) idx.push(a, d, b, b, d, c); else idx.push(a, b, d, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, M.wing));
  return g;
}

/** Flap-track canoe fairing under the wing trailing edge. */
function buildFlapFairing(zf, side) {
  const sec = wingSection(zf); sec.z = zf * side;
  const teX = sec.xLe + sec.chord * Math.cos(sec.inc);
  const teY = sec.yChord + 0.5 * sec.chord * Math.sin(sec.inc) + sec.chord * Math.sin(sec.inc)
              - 0.010 * sec.chord;
  const len = 3.5, wMax = 0.30, dMax = 0.52;
  const xs = [0, 0.12, 0.3, 0.5, 0.7, 0.86, 1.0];
  const rings = [];
  for (const t of xs) {
    const cx = teX - len * (1 - t) + 0.25 * t;
    const wid = wMax * Math.pow(Math.sin(Math.PI * clamp(t, 0.001, 0.999)), 0.6);
    const dep = dMax * Math.pow(Math.sin(Math.PI * clamp(t, 0.001, 0.999)), 0.75);
    const pts = [];
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * TAU;
      pts.push([cx, teY - 0.16 - dep * 0.5 + Math.sin(a) * dep * 0.5, sec.z + Math.cos(a) * wid]);
    }
    rings.push(pts);
  }
  const pos = [], uvs = [], idx = [];
  const m = 14;
  for (let i = 0; i < rings.length; i++) for (let j = 0; j < m; j++) {
    pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
    uvs.push(xs[i], j / m);
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < m; j++) {
    const a = i * m + j, b = i * m + ((j + 1) % m);
    const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
    idx.push(a, d, b, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  orientGeometry(geo, new THREE.Vector3(sec.xLe + sec.chord * 0.4, teY + 2.0, sec.z), new THREE.Vector3(0, 1, 0));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, M.wing);
}

/* ------------------------------- 7. ENGINES ------------------------------ */
/* CF6-80C2B1F pod: 2.70 m max diameter, 2.36 m fan, ~6.9 m long.            */
/* Fan cowl is a near-cylinder to the bypass nozzle at x=3.30, then the smaller
   core cowl takes over — the real CF6 pod is not one continuous taper. */
const NAC_X = [0, 0.30, 0.9, 1.8, 2.6, 3.10, 3.30];
const NAC_R = [1.320, 1.352, 1.352, 1.348, 1.342, 1.336, 1.330];
function nacelleRadius(xr) {
  if (xr <= 0) return NAC_R[0];
  if (xr >= NAC_X[NAC_X.length - 1]) return NAC_R[NAC_R.length - 1];
  for (let i = 0; i < NAC_X.length - 1; i++) {
    if (xr >= NAC_X[i] && xr <= NAC_X[i + 1]) {
      const t = (xr - NAC_X[i]) / (NAC_X[i + 1] - NAC_X[i]);
      return lerp(NAC_R[i], NAC_R[i + 1], smoothstep(t));
    }
  }
  return NAC_R[NAC_R.length - 1];
}

function revolveProfile(xs, rs, segs, mat, { closeFront = false, closeBack = false } = {}) {
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i < xs.length; i++) {
    for (let j = 0; j <= segs; j++) {
      const a = (j / segs) * TAU;
      pos.push(xs[i], Math.cos(a) * rs[i], Math.sin(a) * rs[i]);
      uvs.push(xs[i] / xs[xs.length - 1], j / segs);
    }
  }
  for (let i = 0; i < xs.length - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * (segs + 1) + j, b = a + 1, c = a + segs + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** One engine pod (nacelle, fan, exhaust, pylon) at (xFront, yCentre, z). */
function buildEngine(xFront, yCentre, z, side) {
  const g = new THREE.Group();
  const rBase = S.NACELLE_D / 2;

  /* ---- outer cowl ---- */
  const xs = [], rs = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, xr = t * NAC_X[NAC_X.length - 1];
    xs.push(xr); rs.push(nacelleRadius(xr));
  }
  const cowl = new THREE.Mesh(revolveProfile(xs, rs, 44, M.engineCow), M.engineCow);
  g.add(cowl);

  /* ---- inlet lip (torus) ---- */
  const lip = new THREE.Mesh(new THREE.TorusGeometry(1.30, 0.055, 10, 44), M.metal);
  lip.rotation.y = Math.PI / 2;
  lip.position.x = 0.055;
  g.add(lip);

  /* ---- inlet duct interior (light acoustic lining, fan stays visible) ---- */
  const inXs = [], inRs = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    inXs.push(lerp(0.05, 1.52, t));
    inRs.push(lerp(1.262, 1.175, smoothstep(t)));
  }
  const duct = new THREE.Mesh(revolveProfile(inXs, inRs, 44, M.engineIn), M.engineIn);
  duct.material.side = THREE.DoubleSide;
  g.add(duct);

  /* ---- fan case interior behind the fan ---- */
  const caseXs = [1.52, 2.2, 2.8, 3.30], caseRs = [1.175, 1.175, 1.16, 1.14];
  const fanCase = new THREE.Mesh(revolveProfile(caseXs, caseRs, 40, M.engineIn), M.engineIn);
  fanCase.material.side = THREE.DoubleSide;
  g.add(fanCase);

  /* ---- spinner + fan blades ---- */
  const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.78, 20), M.fanBlade);
  spinner.rotation.z = -Math.PI / 2;
  spinner.position.x = 1.18;
  g.add(spinner);
  const bladeGeo = new THREE.BoxGeometry(0.22, 0.80, 0.05);   // chord x span x thickness
  bladeGeo.translate(0, 0.76, 0);                            // hub 0.36 m -> tip 1.16 m
  const blades = new THREE.InstancedMesh(bladeGeo, M.fanBlade, 38);
  const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), bs = new THREE.Vector3(1, 1, 1), bp = new THREE.Vector3();
  const twist = new THREE.Quaternion();
  for (let i = 0; i < 38; i++) {
    const a = (i / 38) * TAU;
    bp.set(1.56, 0, 0);                                      // on the engine axis at the fan face
    bq.setFromAxisAngle(new THREE.Vector3(1, 0, 0), a);       // around the engine axis
    twist.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.55); // blade twist
    bq.multiply(twist);
    bm.compose(bp, bq, bs);
    blades.setMatrixAt(i, bm);
  }
  blades.instanceMatrix.needsUpdate = true;
  g.add(blades);

  /* ---- bypass nozzle exit annulus at the fan-cowl trailing edge ---- */
  const ringGeo = new THREE.RingGeometry(1.10, 1.328, 44);
  const ring = new THREE.Mesh(ringGeo, M.engineIn);
  ring.rotation.y = Math.PI / 2;
  ring.position.x = 3.30;
  ring.material.side = THREE.DoubleSide;
  g.add(ring);

  /* ---- thrust-reverser split line ---- */
  const sleeve = new THREE.Mesh(new THREE.TorusGeometry(1.352, 0.020, 6, 44), M.gap);
  sleeve.rotation.y = Math.PI / 2;
  sleeve.position.x = 2.35;
  g.add(sleeve);

  /* ---- core cowl: smaller cylinder from inside the fan cowl aft ---- */
  const cXs = [2.40, 3.05, 3.60, 4.30, 5.00, 5.70], cRs = [1.175, 1.150, 1.100, 1.000, 0.880, 0.770];
  g.add(new THREE.Mesh(revolveProfile(cXs, cRs, 40, M.engineCow), M.engineCow));

  /* ---- core exhaust nozzle + plug ---- */
  const nXs = [5.70, 6.10, 6.45], nRs = [0.770, 0.700, 0.665];
  const noz = new THREE.Mesh(revolveProfile(nXs, nRs, 36, M.hot), M.hot);
  noz.material.side = THREE.DoubleSide;
  g.add(noz);
  const plugXs = [5.55, 6.15, 6.70, 7.05], plugRs = [0.560, 0.470, 0.320, 0.055];
  g.add(new THREE.Mesh(revolveProfile(plugXs, plugRs, 32, M.hot), M.hot));

  /* ---- pylon (built in absolute coords; cancel the pod offset) ---- */
  const pyl = buildPylon(xFront, yCentre, z, side);
  pyl.position.set(-xFront, -yCentre, -z);
  g.add(pyl);

  /* ---- position the whole pod ---- */
  g.position.set(xFront, yCentre, z);
  return g;
}

/** Pylon: cantilever strut from the nacelle crown up into the wing lower surface. */
function buildPylon(xFront, yCentre, z, side) {
  const g = new THREE.Group();
  const sec = wingSection(Math.abs(z));
  const wingLower = x => {
    const xc = clamp((x - sec.xLe) / sec.chord, 0, 1);
    return wingPoint(sec, xc, -airfoilThickness(xc, sec.tc)).y;
  };
  const nacTop = xr => yCentre + nacelleRadius(xr) * 0.94;
  const stations = [-0.15, 0.35, 0.95, 1.7, 2.5, 3.4, 4.3, 5.1, 5.75, 6.0];
  const rings = [];
  for (const dx of stations) {
    const xAbs = xFront + dx;
    /* top edge: fairing above the nacelle blending into the wing lower surface
       (buried 0.55 m inside the wing so no seam can open up) */
    const tBlend = smoothstep((xAbs - (sec.xLe - 1.4)) / 2.6);
    const yTop = lerp(nacTop(Math.max(0, dx)) + 0.62, wingLower(Math.max(xAbs, sec.xLe)) + 0.55, tBlend);
    const yBot = nacTop(Math.max(0, dx)) - 0.18;
    /* rounded leading and trailing ends */
    const fFront = smoothstep((dx + 0.15) / 0.55);
    const fAft = 1 - smoothstep((dx - 4.9) / 1.1);
    const fEnd = Math.max(0.04, fFront * fAft);
    const pts = [];
    const N = 16;
    for (let k = 0; k < N; k++) {
      const a = (k / N) * TAU;
      const cz = Math.cos(a), cy = Math.sin(a);
      const u = (cy + 1) / 2;                       // 0 = bottom, 1 = top
      /* airfoil-like thickness: thin at the bottom, max at ~45 % height */
      const wHalf = (0.30 + 0.30 * Math.sin(Math.PI * Math.pow(u, 0.8))) * 0.5 * fEnd;
      const yy = lerp(yBot, yTop, u);
      pts.push([xAbs, yy, z + Math.sign(cz) * Math.pow(Math.abs(cz), 0.55) * wHalf]);
    }
    rings.push(pts);
  }
  const pos = [], uvs = [], idx = [];
  const m = 16;
  for (let i = 0; i < rings.length; i++) for (let j = 0; j < m; j++) {
    pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
    uvs.push(i / (rings.length - 1), j / m);
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < m; j++) {
    const a = i * m + j, b = i * m + ((j + 1) % m);
    const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
    idx.push(a, d, b, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  orientGeometry(geo, new THREE.Vector3(xFront + 2.5, yCentre + 3.0, z), new THREE.Vector3(0, 1, 0));
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, M.white));
  return g;
}

/** All four engines, positioned from the wing geometry. */
function buildEngines() {
  const g = new THREE.Group();
  const out = [];
  for (const [zz, side] of [[S.ENGINE_Z_IN, 1], [S.ENGINE_Z_OUT, 1],
                            [S.ENGINE_Z_IN, -1], [S.ENGINE_Z_OUT, -1]]) {
    const sec = wingSection(zz);
    const leX = sec.xLe;
    const xFront = leX - 5.0;
    const lowerY = wingPoint(sec, 0.25, -airfoilThickness(0.25, sec.tc)).y;
    let yCentre = lowerY - 0.62 - S.NACELLE_D / 2;
    yCentre = Math.max(yCentre, S.NACELLE_BOTTOM + S.NACELLE_D / 2);
    out.push(buildEngine(xFront, yCentre, zz * side, side));
  }
  out.forEach(e => g.add(e));
  return g;
}

/* -------------------------------- 8. TAIL -------------------------------- */
function buildFin() {
  const g = new THREE.Group();
  const rootY = S.AFT_TOP_Y;
  const stations = [0, 0.1, 0.22, 0.36, 0.5, 0.64, 0.78, 0.9, 1.0];
  const loopN = 26;
  const rings = [];
  for (const t of stations) {
    const h = S.FIN_HEIGHT * t;
    const xLe = S.FIN_ROOT_X + h * Math.tan(S.FIN_SWEEP);
    const chord = lerp(S.FIN_ROOT_CHORD, S.FIN_TIP_CHORD, Math.pow(t, 0.92));
    const tc = lerp(0.115, 0.085, t);
    const y = rootY + h;
    const loop = airfoilLoop(tc, lerp(0.0, 0.0, t), loopN);
    const pts = [];
    for (const [xc, yc] of loop) {
      pts.push([xLe + xc * chord, y, yc * chord]);
    }
    rings.push(pts);
  }
  const pos = [], uvs = [], idx = [];
  const m = rings[0].length;
  for (let i = 0; i < rings.length; i++) for (let j = 0; j < m; j++) {
    pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
    uvs.push(stations[i], j / m);
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < m; j++) {
    const a = i * m + j, b = i * m + ((j + 1) % m);
    const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
    idx.push(a, b, d, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const fin = new THREE.Mesh(geo, M.fin);
  g.add(fin);

  /* fin tip cap */
  const t = 1.0, h = S.FIN_HEIGHT, xLe = S.FIN_ROOT_X + h * Math.tan(S.FIN_SWEEP);
  const chord = S.FIN_TIP_CHORD, y = rootY + h;
  const capPts = airfoilLoop(0.085, 0, loopN).map(([xc, yc]) => new THREE.Vector3(xLe + xc * chord, y, yc * chord));
  const capPos = [], capIdx = [];
  let cx = 0, cy = 0;
  capPts.forEach(p => { cx += p.x; cy += p.y; });
  cx /= capPts.length; cy /= capPts.length;
  capPos.push(cx, cy, 0);
  capPts.forEach(p => capPos.push(p.x, p.y, p.z));
  for (let j = 0; j < capPts.length; j++) {
    const a = 1 + j, b = 1 + ((j + 1) % capPts.length);
    capIdx.push(0, a, b);
  }
  const capGeo = new THREE.BufferGeometry();
  capGeo.setAttribute('position', new THREE.Float32BufferAttribute(capPos, 3));
  capGeo.setIndex(capIdx);
  capGeo.computeVertexNormals();
  orientGeometry(capGeo, new THREE.Vector3(cx, cy + 0.2, 0), new THREE.Vector3(0, 1, 0));
  capGeo.computeVertexNormals();
  g.add(new THREE.Mesh(capGeo, M.fin));

  /* dorsal fin (leading-edge root fairing) */
  const dPos = [], dUv = [], dIdx = [];
  const dN = 10;
  for (let i = 0; i <= dN; i++) {
    const t2 = i / dN;
    const x = lerp(50.5, S.FIN_ROOT_X + 0.9, t2);
    const yTop = lerp(rootY + 0.02, rootY + 2.55, Math.pow(t2, 1.25));
    const yBot = fuselageStation(x).topY - 0.02;
    const halfW = lerp(0.16, 0.62, t2);
    dPos.push(x, yBot, 0, x, yTop, halfW, x, yTop, -halfW);
    dUv.push(t2, 0, t2, 0.5, t2, 1);
  }
  for (let i = 0; i < dN; i++) {
    const a = i * 3, b = (i + 1) * 3;
    dIdx.push(a, b, a + 1, b, b + 1, a + 1);
    dIdx.push(a + 1, b + 1, a + 2, b + 1, b + 2, a + 2);
  }
  const dGeo = new THREE.BufferGeometry();
  dGeo.setAttribute('position', new THREE.Float32BufferAttribute(dPos, 3));
  dGeo.setAttribute('uv', new THREE.Float32BufferAttribute(dUv, 2));
  dGeo.setIndex(dIdx);
  dGeo.computeVertexNormals();
  g.add(new THREE.Mesh(dGeo, M.fin));

  /* fin-root fairing filling the wedge over the tail cone */
  const fRings = [];
  for (const x of [55.0, 57.5, 60.0, 62.5, 65.0, 67.0]) {
    const st = fuselageStation(x);
    const yTop = rootY;
    const yBot = Math.min(st.topY, yTop - 0.05);
    const halfTop = 0.44 * (1 - smoothstep((x - 62) / 6));
    const halfBot = st.halfW * 0.72;
    const pts = [];
    const N = 14;
    for (let k = 0; k < N; k++) {
      const a = (k / N) * TAU;
      const cz = Math.cos(a), cy = Math.sin(a);
      const w = lerp(halfBot, Math.max(halfTop, 0.06), (cy + 1) / 2);
      const yy = lerp(yBot, yTop, (cy + 1) / 2);
      pts.push([x, yy, Math.sign(cz) * Math.pow(Math.abs(cz), 0.55) * w]);
    }
    fRings.push(pts);
  }
  const fPos = [], fUv = [], fIdx = [];
  const fm = 14;
  for (let i = 0; i < fRings.length; i++) for (let j = 0; j < fm; j++) {
    fPos.push(fRings[i][j][0], fRings[i][j][1], fRings[i][j][2]);
    fUv.push(i / (fRings.length - 1), j / fm);
  }
  for (let i = 0; i < fRings.length - 1; i++) for (let j = 0; j < fm; j++) {
    const a = i * fm + j, b = i * fm + ((j + 1) % fm);
    const c = (i + 1) * fm + ((j + 1) % fm), d = (i + 1) * fm + j;
    fIdx.push(a, d, b, b, d, c);
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3));
  fGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fUv, 2));
  fGeo.setIndex(fIdx);
  fGeo.computeVertexNormals();
  g.add(new THREE.Mesh(fGeo, M.fuselage));

  /* rudder hinge line (the -400 has upper and lower rudder segments) */
  const hingeMat = new THREE.MeshBasicMaterial({ color: 0x1a1e24, transparent: true, opacity: 0.8 });
  for (const side of [1, -1]) {
    const pts = [], uvs = [], idx = [];
    const N = 16;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      for (const xc of [0.700, 0.712]) {
        const p = finSurfacePoint(t, xc, side, 0.006);
        pts.push(p.x, p.y, p.z);
      }
    }
    for (let i = 0; i <= N; i++) { uvs.push(0, i / N, 1, i / N); }
    for (let i = 0; i < N; i++) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      if (side > 0) idx.push(a, b, c, b, d, c); else idx.push(a, c, b, b, c, d);
    }
    const hg = new THREE.BufferGeometry();
    hg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    hg.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    hg.setIndex(idx); hg.computeVertexNormals();
    g.add(new THREE.Mesh(hg, hingeMat));
  }
  /* HF antenna in the fin leading edge */
  for (const s of [1, -1]) {
    const hf = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.10, 0.06), M.darkGrey);
    hf.position.set(S.FIN_ROOT_X + 3.2, rootY + 4.1, s * 0.42);
    hf.rotation.z = -Math.tan(S.FIN_SWEEP);
    g.add(hf);
  }
  /* white strobe / tail nav light on the fin tip */
  const strobe = new THREE.Mesh(new THREE.SphereGeometry(0.10, 10, 8), M.navWhite);
  strobe.position.set(S.FIN_ROOT_X + h * Math.tan(S.FIN_SWEEP) + chord - 0.22, y - 0.11, 0);
  g.add(strobe);
  return g;
}

function buildStabilizer() {
  const g = new THREE.Group();
  for (const side of [1, -1]) {
    const stations = [0, 0.12, 0.28, 0.46, 0.64, 0.8, 0.92, 1.0];
    const loopN = 22;
    const rings = [];
    for (const t of stations) {
      const z = S.STAB_SPAN / 2 * t * side;
      const xLe = S.STAB_LE_X + S.STAB_SPAN / 2 * t * Math.tan(S.STAB_SWEEP);
      const chord = lerp(S.STAB_ROOT_CHORD, S.STAB_TIP_CHORD, Math.pow(t, 0.9));
      const y = S.STAB_Y + Math.abs(z) * Math.tan(S.STAB_DIHEDRAL);
      const tc = lerp(0.11, 0.09, t);
      const loop = airfoilLoop(tc, 0, loopN);
      const pts = [];
      for (const [xc, yc] of loop) pts.push([xLe + xc * chord, y + yc * chord, z]);
      rings.push(pts);
    }
    const pos = [], uvs = [], idx = [];
    const m = rings[0].length;
    for (let i = 0; i < rings.length; i++) for (let j = 0; j < m; j++) {
      pos.push(rings[i][j][0], rings[i][j][1], rings[i][j][2]);
      uvs.push(stations[i], j / m);
    }
    for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < m; j++) {
      const a = i * m + j, b = i * m + ((j + 1) % m);
      const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
      if (side > 0) idx.push(a, d, b, b, d, c); else idx.push(a, b, d, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, M.white));

    /* elevator hinge line (upper and lower surfaces) */
    const hingeMat = new THREE.MeshBasicMaterial({ color: 0x1a1e24, transparent: true, opacity: 0.8 });
    const hPos = [], hUv = [], hIdx = [];
    const N = 12;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const z = S.STAB_SPAN / 2 * t * side;
      const xLe = S.STAB_LE_X + S.STAB_SPAN / 2 * t * Math.tan(S.STAB_SWEEP);
      const chord = lerp(S.STAB_ROOT_CHORD, S.STAB_TIP_CHORD, Math.pow(t, 0.9));
      const y = S.STAB_Y + Math.abs(z) * Math.tan(S.STAB_DIHEDRAL);
      const tc = lerp(0.11, 0.09, t);
      for (const xc of [0.735, 0.748]) {
        const yt = airfoilThickness(xc, tc) * chord;
        hPos.push(xLe + xc * chord, y + yt + 0.006, z);
        hPos.push(xLe + xc * chord, y - yt - 0.006, z);
      }
      hUv.push(0, t, 1, t, 0, t, 1, t);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 4;
      if (side > 0) { hIdx.push(a, a + 1, a + 4, a + 1, a + 5, a + 4, a + 2, a + 6, a + 3, a + 3, a + 6, a + 7); }
      else { hIdx.push(a, a + 4, a + 1, a + 1, a + 4, a + 5, a + 2, a + 3, a + 6, a + 3, a + 7, a + 6); }
    }
    const hGeo = new THREE.BufferGeometry();
    hGeo.setAttribute('position', new THREE.Float32BufferAttribute(hPos, 3));
    hGeo.setAttribute('uv', new THREE.Float32BufferAttribute(hUv, 2));
    hGeo.setIndex(hIdx); hGeo.computeVertexNormals();
    g.add(new THREE.Mesh(hGeo, hingeMat));
  }
  return g;
}

/* ---------------------------- 9. LANDING GEAR ---------------------------- */
/** Aircraft tyre: revolved rounded-tread profile (radius r, width w). */
function tireGeometry(r, w) {
  const pts = [];
  const N = 12;
  const hw = w / 2;
  const shoulder = 0.16 * w;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(lerp(r - shoulder * 0.55, r, smoothstep(t)), lerp(-hw + shoulder * 0.35, -hw + shoulder, t)));
  }
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(lerp(r, r - shoulder * 0.55, smoothstep(t)), lerp(-hw + shoulder, hw - shoulder, t)));
  }
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector2(lerp(r - shoulder * 0.55, r - shoulder * 0.55, t), lerp(hw - shoulder, hw - shoulder * 0.35, t)));
  }
  const g = new THREE.LatheGeometry(pts, 30);
  g.rotateX(Math.PI / 2);      // axis -> Z (lateral)
  g.computeVertexNormals();
  return g;
}

/** One wheel: tyre + hub + brake pack. */
function buildWheel(r, w, mat = M.tire) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(tireGeometry(r, w), mat));
  const hubR = r * 0.56, hubW = w * 0.62;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR, hubR, hubW, 20), M.hub);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(hubR * 0.96, w * 0.10, 8, 20), M.hub);
  rim.rotation.y = Math.PI / 2;
  g.add(rim);
  // brake pack
  for (const s of [1, -1]) {
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(hubR * 0.82, hubR * 0.82, 0.035, 18), M.metalDark);
    disc.rotation.x = Math.PI / 2;
    disc.position.z = s * (hubW * 0.5 + 0.03);
    g.add(disc);
  }
  return g;
}

function tube(from, to, r, mat) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r, r, len, 12);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(from).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

/** Oleo leg + bogie (or twin-wheel) assembly. */
function buildGearLeg({ x, z, trunnionY, strutR, bogie, wheelR, wheelW, axleDX, axleDZ, doors }) {
  const g = new THREE.Group();
  g.userData.trunnion = new THREE.Vector3(x, trunnionY, z);
  const axleY = wheelR;
  const pivotY = axleY + 0.62;                      // bogie pivot height
  const top = new THREE.Vector3(x, trunnionY, z);
  const bottom = new THREE.Vector3(x, pivotY, z);

  /* trunnion */
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(strutR * 1.15, strutR * 1.15, 0.95, 14), M.metal);
  tr.rotation.x = Math.PI / 2;
  tr.position.set(x, trunnionY, z);
  g.add(tr);

  /* outer cylinder (upper) and piston (lower) */
  const midY = lerp(trunnionY, pivotY, 0.42);
  g.add(tube(new THREE.Vector3(x, trunnionY - 0.12, z), new THREE.Vector3(x, midY, z), strutR, M.metal));
  g.add(tube(new THREE.Vector3(x, midY + 0.06, z), bottom, strutR * 0.80, M.chrome));
  /* scissor torque links */
  const tl1 = tube(new THREE.Vector3(x, midY + 0.42, z + strutR * 0.9), new THREE.Vector3(x + 0.30, midY - 0.20, z + strutR * 0.5), 0.075, M.metalDark);
  const tl2 = tube(new THREE.Vector3(x + 0.30, midY - 0.20, z + strutR * 0.5), new THREE.Vector3(x, midY - 0.78, z + strutR * 0.9), 0.075, M.metalDark);
  g.add(tl1); g.add(tl2);

  /* drag brace: aft and inboard */
  g.add(tube(new THREE.Vector3(x - 0.10, trunnionY - 0.20, z), new THREE.Vector3(x - 1.55, pivotY + 0.30, z), 0.085, M.metalDark));
  g.add(tube(new THREE.Vector3(x - 1.75, pivotY + 0.42, z), new THREE.Vector3(x - 0.10, trunnionY - 0.05, z), 0.07, M.chrome));
  /* side brace */
  g.add(tube(new THREE.Vector3(x + 0.10, trunnionY - 0.30, z + Math.sign(z) * 0.2),
             new THREE.Vector3(x + 0.35, pivotY + 0.55, z + Math.sign(z) * 1.35), 0.08, M.metalDark));

  /* hydraulic lines */
  for (const s of [1, -1]) {
    g.add(tube(new THREE.Vector3(x + s * 0.16, trunnionY - 0.35, z + s * 0.16),
               new THREE.Vector3(x + s * 0.13, pivotY + 0.35, z + s * 0.13), 0.028, M.metalDark));
  }

  if (bogie) {
    /* bogie beam */
    const beam = new THREE.Mesh(new THREE.BoxGeometry(axleDX * 2 + 0.45, 0.30, 0.46), M.metal);
    beam.position.set(x, pivotY - 0.16, z);
    g.add(beam);
    const beam2 = new THREE.Mesh(new THREE.BoxGeometry(axleDX * 2 + 0.30, 0.20, 0.62), M.metalDark);
    beam2.position.set(x, pivotY - 0.34, z);
    g.add(beam2);
    /* axles + 4 wheels */
    for (const dz of [-1, 1]) for (const dx of [-1, 1]) {
      const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, axleDZ + 0.5, 12), M.metal);
      ax.rotation.x = Math.PI / 2;
      ax.position.set(x + dx * axleDX, axleY, z + dz * axleDZ / 2);
      g.add(ax);
      const w = buildWheel(wheelR, wheelW);
      w.position.set(x + dx * axleDX, axleY, z + dz * axleDZ / 2);
      g.add(w);
    }
    /* bogie pitch actuator */
    g.add(tube(new THREE.Vector3(x - 0.55, pivotY + 0.30, z + 0.28), new THREE.Vector3(x - 0.95, pivotY - 0.55, z + 0.28), 0.06, M.chrome));
  } else {
    /* twin-wheel nose gear */
    const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, axleDZ + 0.5, 12), M.metal);
    ax.rotation.x = Math.PI / 2;
    ax.position.set(x, axleY, z);
    g.add(ax);
    for (const dz of [-1, 1]) {
      const w = buildWheel(wheelR, wheelW);
      w.position.set(x, axleY, z + dz * axleDZ / 2);
      g.add(w);
    }
    /* steering collar + tiller arms */
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(strutR * 1.35, strutR * 1.35, 0.24, 14), M.metalDark);
    collar.position.set(x, midY + 0.55, z);
    g.add(collar);
    g.add(tube(new THREE.Vector3(x, midY + 0.55, z + strutR), new THREE.Vector3(x - 0.55, midY + 0.55, z + strutR + 0.45), 0.05, M.metalDark));
    g.add(tube(new THREE.Vector3(x, midY + 0.55, z - strutR), new THREE.Vector3(x - 0.55, midY + 0.55, z - strutR - 0.45), 0.05, M.metalDark));
    /* taxi/landing lights on the nose gear */
    for (const s of [1, -1]) {
      const l = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.10, 12), M.landing);
      l.rotation.z = Math.PI / 2;
      l.position.set(x + 0.28, axleY + 0.75, z + s * 0.30);
      g.add(l);
    }
  }

  /* doors (open) */
  if (doors) {
    for (const s of [1, -1]) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.06, 0.95), M.white);
      d.position.set(x + 0.1, trunnionY - 0.55, z + s * 1.05);
      d.rotation.x = s * 1.15;
      d.rotation.z = 0.06;
      g.add(d);
      const rib = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.10, 0.06), M.metalDark);
      rib.position.set(x + 0.1, trunnionY - 0.62, z + s * 1.05);
      rib.rotation.x = s * 1.15;
      g.add(rib);
    }
  }
  return g;
}

function buildLandingGear() {
  const g = new THREE.Group();
  const R = S.TIRE_D / 2;

  /* nose gear */
  g.add(buildGearLeg({
    x: S.NOSE_GEAR_X, z: 0, trunnionY: 4.05, strutR: 0.16, bogie: false,
    wheelR: R, wheelW: S.TIRE_W_NOSE, axleDX: 0, axleDZ: S.NOSE_TIRE_TRACK, doors: true
  }));

  /* four main legs */
  for (const zz of [S.BODY_GEAR_Z, S.WING_GEAR_Z, -S.BODY_GEAR_Z, -S.WING_GEAR_Z]) {
    g.add(buildGearLeg({
      x: S.MAIN_GEAR_X, z: zz, trunnionY: 4.05, strutR: 0.19, bogie: true,
      wheelR: R, wheelW: S.TIRE_W_MAIN, axleDX: S.BOGIE_AXLE_DX, axleDZ: S.BOGIE_AXLE_DZ, doors: true
    }));
  }

  /* wheel-well recesses (dark, so the open bays read as openings) */
  const wellMat = M.gap;
  const wells = [
    { x: S.NOSE_GEAR_X, z: 0, w: 1.9, l: 3.0, y: S.KEEL_Y + 0.30 },
    { x: S.MAIN_GEAR_X, z: S.BODY_GEAR_Z, w: 1.6, l: 3.6, y: S.KEEL_Y + 0.30 },
    { x: S.MAIN_GEAR_X, z: -S.BODY_GEAR_Z, w: 1.6, l: 3.6, y: S.KEEL_Y + 0.30 },
    { x: S.MAIN_GEAR_X, z: S.WING_GEAR_Z, w: 1.8, l: 3.8, y: S.KEEL_Y + 0.75 },
    { x: S.MAIN_GEAR_X, z: -S.WING_GEAR_Z, w: 1.8, l: 3.8, y: S.KEEL_Y + 0.75 }
  ];
  for (const w of wells) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(w.l, 1.5, w.w), wellMat);
    box.position.set(w.x, w.y + 0.75, w.z);
    box.userData.well = true;
    g.add(box);
  }
  return g;
}

/* ------------------------- 10. LIVERY / DECALS --------------------------- */
function textTexture(text, opts = {}) {
  const {
    font = 'bold 120px "Helvetica Neue", Arial, sans-serif',
    color = '#123c74', W = 1024, H = 256, align = 'center', pad = 24, italic = false
  } = opts;
  const { c, x } = makeCanvas(W, H);
  x.clearRect(0, 0, W, H);
  x.font = font;
  x.fillStyle = color;
  x.textAlign = align;
  x.textBaseline = 'middle';
  const cx = align === 'center' ? W / 2 : pad;
  x.fillText(text, cx, H / 2);
  return canvasTexture(c);
}

/** Airline titles + registration decals on both sides of the fuselage. */
function buildLiveryDecals(L) {
  const g = new THREE.Group();
  /* canvas aspect ratio is matched to the patch size so the type is not stretched */
  const titleTex = textTexture(L.name, { font: 'bold 118px "Helvetica Neue", Arial, sans-serif', color: L.text, W: 1600, H: 160 });
  const regTex = textTexture(L.reg, { font: 'bold 62px "Helvetica Neue", Arial, sans-serif', color: L.text2, W: 900, H: 90 });
  const nameTex = textTexture('BOEING 747-400', { font: '600 46px "Helvetica Neue", Arial, sans-serif', color: L.text2, W: 1400, H: 70 });
  for (const side of [1, -1]) {
    /* bottom -> top order so the artwork is upright on both sides */
    const add = (x0, x1, yBot, yTop, tex, nx, nv) => {
      const p = fuselagePatch(x0, x1, vAtY((x0 + x1) / 2, yBot, side),
                              vAtY((x0 + x1) / 2, yTop, side), nx, nv, 0.012, M.decal.clone(), side < 0);
      p.material.map = tex; p.material.needsUpdate = true;
      g.add(p);
    };
    add(11.0, 21.5, 5.60, 6.65, titleTex, 12, 6);     // 10.5 m x 1.05 m
    add(44.0, 49.5, 5.52, 6.07, regTex, 10, 5);       //  5.5 m x 0.55 m
    add(25.5, 34.5, 5.28, 5.73, nameTex, 10, 4);      //  9.0 m x 0.45 m
  }
  return g;
}

/** Point on the vertical fin surface (for logo decals). */
function finSurfacePoint(t, xc, side, offset = 0) {
  const h = S.FIN_HEIGHT * t;
  const xLe = S.FIN_ROOT_X + h * Math.tan(S.FIN_SWEEP);
  const chord = lerp(S.FIN_ROOT_CHORD, S.FIN_TIP_CHORD, Math.pow(t, 0.92));
  const tc = lerp(0.115, 0.085, t);
  const y = S.AFT_TOP_Y + h;
  const z = side * (airfoilThickness(xc, tc) * chord + offset);
  return new THREE.Vector3(xLe + xc * chord, y, z);
}
function finPatch(t0, t1, xc0, xc1, side, offset, mat) {
  const nx = 8, ny = 8, pos = [], uvs = [], idx = [];
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= ny; j++) {
    const p = finSurfacePoint(lerp(t0, t1, i / nx), lerp(xc0, xc1, j / ny), side, offset);
    pos.push(p.x, p.y, p.z); uvs.push(j / ny, i / nx);
  }
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const a = i * (ny + 1) + j, b = a + 1, c = a + ny + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  orientGeometry(geo, finSurfacePoint((t0 + t1) / 2, (xc0 + xc1) / 2, side, 0),
                 new THREE.Vector3(0, 0, side));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}
function buildTailLogo(L) {
  const g = new THREE.Group();
  const logoTex = (() => {
    const { c, x } = makeCanvas(512, 512);
    x.clearRect(0, 0, 512, 512);
    x.fillStyle = L.tailInk;
    x.save(); x.translate(256, 256);
    x.beginPath();
    x.moveTo(-170, 90);
    x.bezierCurveTo(-40, 20, 60, -40, 180, -140);
    x.bezierCurveTo(90, -10, 10, 60, -40, 120);
    x.closePath(); x.fill();
    x.beginPath();
    x.moveTo(-140, 150);
    x.bezierCurveTo(-20, 80, 70, 20, 165, -70);
    x.bezierCurveTo(60, 60, -30, 120, -90, 175);
    x.closePath(); x.fill();
    x.restore();
    return canvasTexture(c);
  })();
  for (const side of [1, -1]) {
    const p = finPatch(0.42, 0.86, 0.12, 0.72, side, 0.015, M.decal.clone());
    p.material.map = logoTex; p.material.needsUpdate = true;
    g.add(p);
  }
  return g;
}

/* -------------------------- 11. WING-BODY FAIRING ------------------------ */
/**
 * Wing-body fairing: the fuselage skin is displaced outward by a smooth
 * teardrop bump that peaks where the wing root passes through it.  This gives
 * a sculpted fillet instead of a lens-shaped bulge, and it dissolves back into
 * the fuselage exactly (zero displacement) at its own boundary.
 */
function buildWingBodyFairing() {
  const grp = new THREE.Group();
  const X0 = 23.0, X1 = 47.5;
  const V0 = 0.065, V1 = 0.335;          // keel side -> shoulder, one side only
  const NX = 48, NV = 20;
  const pos = [], uvs = [], idx = [];
  const nrm = new THREE.Vector3();
  for (let i = 0; i <= NX; i++) {
    const x = lerp(X0, X1, i / NX);
    /* chordwise teardrop: rises just ahead of the wing root, trails off aft */
    const fx = smoothstep((x - X0) / 4.0) * (1 - smoothstep((x - 37.5) / 10.0));
    for (let j = 0; j <= NV; j++) {
      const v = lerp(V0, V1, j / NV);
      const p = fuselageSurface(x, v);
      fuselageNormal(x, v, nrm);
      /* vertical falloff centred on the wing root chord line */
      const gy = Math.exp(-Math.pow((p.y - 4.55) / 1.45, 2));
      const gv = smoothstep((v - V0) / 0.055);      // fade out at the keel seam
      const bulge = 0.60 * fx * gy * gv;
      p.addScaledVector(nrm, bulge);
      pos.push(p.x, p.y, p.z);
      uvs.push(x / S.LENGTH, v);          // same mapping as the fuselage skin
    }
  }
  for (let i = 0; i < NX; i++) for (let j = 0; j < NV; j++) {
    const a = i * (NV + 1) + j, b = a + 1, c = a + NV + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  orientGeometry(geo, new THREE.Vector3(34, 4.8, 0), new THREE.Vector3(0, 0, 1));
  geo.computeVertexNormals();
  const stbd = new THREE.Mesh(geo, M.fuselage);
  grp.add(stbd);

  /* mirror for the port side */
  const port = stbd.clone();
  port.geometry = geo.clone();
  port.geometry.scale(1, 1, -1);
  port.geometry.computeVertexNormals();
  orientGeometry(port.geometry, new THREE.Vector3(34, 4.8, 0), new THREE.Vector3(0, 0, -1));
  port.geometry.computeVertexNormals();
  grp.add(port);
  return grp;
}

/* ----------------------------- 12. ASSEMBLY ------------------------------ */
function buildAircraft() {
  const root = new THREE.Group();
  root.name = 'Boeing 747-400';

  const fus = buildFuselage();
  const fuselage = new THREE.Mesh(fus.geo, M.fuselage);
  fuselage.name = 'fuselage';
  fuselage.castShadow = true; fuselage.receiveShadow = true;
  root.add(fuselage);

  const add = (o, shadow = true) => {
    o.traverse(c => { if (c.isMesh) { c.castShadow = shadow; c.receiveShadow = true; } });
    root.add(o);
    return o;
  };

  add(buildWingBodyFairing());
  const winParts = buildWindows();
  winParts.forEach(w => add(w, false));
  add(buildCockpit(), false);
  add(buildDoors(), false);
  add(buildFuselageDetails());

  const wingR = add(buildWingPanel(1));
  const wingL = add(buildWingPanel(-1));
  const engines = add(buildEngines());

  const fin = add(buildFin());
  const stab = add(buildStabilizer());

  const gear = new THREE.Group();
  gear.name = 'gear';
  gear.add(buildLandingGear());
  root.add(gear);

  /* navigation lights: red left, green right, white at the tail cone */
  const wtip = wingSection(S.SEMI);
  const wingletTipY = wtip.yChord + S.WINGLET_H * Math.cos(S.WINGLET_CANT);
  const wingletTipX = wtip.xLe + 0.42 + 0.62 * S.WINGLET_H + S.WINGLET_TIP_C * 0.5;
  const navL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), M.navRed);
  navL.position.set(wingletTipX - 0.25, wingletTipY + 0.05, -(S.SEMI_TOTAL - 0.14));
  root.add(navL);
  const navR = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), M.navGreen);
  navR.position.set(wingletTipX - 0.25, wingletTipY + 0.05, S.SEMI_TOTAL - 0.14);
  root.add(navR);
  const wStrobeL = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), M.navWhite);
  wStrobeL.position.set(wingletTipX - 0.55, wingletTipY - 0.06, -S.SEMI_TOTAL + 0.12);
  root.add(wStrobeL);
  const wStrobeR = wStrobeL.clone(); wStrobeR.position.z = S.SEMI_TOTAL - 0.12; root.add(wStrobeR);
  const strobeL = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), M.navWhite);
  strobeL.position.set(S.LENGTH - 0.5, 4.9, 0.45); root.add(strobeL);
  const strobeR = strobeL.clone(); strobeR.position.z = -0.45; root.add(strobeR);

  /* the model is built nose-at-x=0; centre it for orbiting */
  root.position.x = -S.LENGTH / 2;
  root.userData.parts = { fuselage, wingR, wingL, engines, fin, stab, gear };
  return root;
}

/** Re-paint the aircraft in a different livery. */
function applyLivery(root, key) {
  const L = LIVERY[key] || LIVERY.house;
  M.fuselage.map = fuselageTexture(L);
  M.fuselage.needsUpdate = true;
  M.fin.map = finTexture(L);
  M.fin.needsUpdate = true;
  const old = root.getObjectByName('livery');
  if (old) {
    old.traverse(o => { if (o.isMesh) { o.geometry.dispose(); if (o.material.map) o.material.map.dispose(); } });
    root.remove(old);
  }
  const g = new THREE.Group();
  g.name = 'livery';
  g.add(buildLiveryDecals(L));
  g.add(buildTailLogo(L));
  root.add(g);
  return L;
}

/* ------------------------------ 13. SCENE -------------------------------- */
const HEADLESS = globalThis.__DSH_HEADLESS__ === true;

const SKY = {
  top: new THREE.Color(0x16233c), mid: new THREE.Color(0x5f7ba3), bot: new THREE.Color(0x1c2128)
};
function skyMaterial() {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      cTop: { value: SKY.top }, cMid: { value: SKY.mid }, cBot: { value: SKY.bot },
      sunDir: { value: new THREE.Vector3(-0.45, 0.72, 0.52).normalize() }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 cTop, cMid, cBot; uniform vec3 sunDir; varying vec3 vP;',
      'void main(){',
      '  vec3 d = normalize(vP);',
      '  float h = d.y;',
      '  vec3 c = mix(cBot, cMid, smoothstep(-0.22, 0.22, h));',
      '  c = mix(c, cTop, smoothstep(0.10, 0.95, h));',
      '  float sun = pow(max(dot(d, sunDir), 0.0), 320.0);',
      '  float glow = pow(max(dot(d, sunDir), 0.0), 6.0) * 0.16;',
      '  c += vec3(1.0, 0.93, 0.82) * (sun * 2.4 + glow);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
}

function buildEnvironment(renderer) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 32, 20), skyMaterial()));
  const sun = new THREE.Mesh(new THREE.SphereGeometry(9, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xfff6e6 }));
  sun.position.set(-54, 86, 62);
  envScene.add(sun);
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(600, 600),
    new THREE.MeshBasicMaterial({ color: 0x2b3038 }));
  gnd.rotation.x = -Math.PI / 2; gnd.position.y = -1;
  envScene.add(gnd);
  const rt = pmrem.fromScene(envScene, 0.02);
  pmrem.dispose();
  return rt.texture;
}

/* --------------------------- 14. ORBIT CONTROLS -------------------------- */
class Orbit {
  constructor(camera, dom) {
    this.camera = camera; this.dom = dom;
    this.target = new THREE.Vector3(0, 6, 0);
    this.tTarget = this.target.clone();
    this.theta = 0.85; this.phi = 1.18; this.radius = 96;
    this.tTheta = this.theta; this.tPhi = this.phi; this.tRadius = this.radius;
    this.spin = 0;
    this.minPhi = 0.07; this.maxPhi = 1.535;
    this.minR = 3.2; this.maxR = 420;
    this.pointers = new Map();
    this.lastPan = null;
    this._bind();
  }
  _bind() {
    const d = this.dom;
    d.style.touchAction = 'none';
    d.addEventListener('pointerdown', e => {
      d.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button, shift: e.shiftKey });
    });
    d.addEventListener('pointerup', e => { this.pointers.delete(e.pointerId); this.lastPan = null; });
    d.addEventListener('pointercancel', e => { this.pointers.delete(e.pointerId); this.lastPan = null; });
    d.addEventListener('pointermove', e => {
      const p = this.pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      const pan = p.button === 2 || p.shift || this.pointers.size > 1;
      if (pan) this.pan(dx, dy);
      else this.orbit(dx, dy);
    });
    d.addEventListener('wheel', e => {
      e.preventDefault();
      this.tRadius = clamp(this.tRadius * Math.exp(e.deltaY * 0.0011), this.minR, this.maxR);
    }, { passive: false });
    d.addEventListener('contextmenu', e => e.preventDefault());
  }
  orbit(dx, dy) {
    this.tTheta -= dx * 0.0055;
    this.tPhi = clamp(this.tPhi - dy * 0.0045, this.minPhi, this.maxPhi);
  }
  pan(dx, dy) {
    const k = this.radius * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrix, 1);
    this.tTarget.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  }
  setView(v, instant = false) {
    const t = v.target;
    this.tTarget.set(t[0] - S.LENGTH / 2, t[1], t[2]);
    this.tTheta = v.theta; this.tPhi = clamp(v.phi, this.minPhi, this.maxPhi);
    this.tRadius = clamp(v.radius, this.minR, this.maxR);
    if (instant) { this.target.copy(this.tTarget); this.theta = this.tTheta; this.phi = this.tPhi; this.radius = this.tRadius; }
  }
  update(dt) {
    const k = 1 - Math.pow(0.0016, dt);
    if (this.spin) this.tTheta += this.spin * dt * 0.22;
    this.theta += (this.tTheta - this.theta) * k;
    this.phi += (this.tPhi - this.phi) * k;
    this.radius += (this.tRadius - this.radius) * k;
    this.target.lerp(this.tTarget, k);
    const sp = Math.sin(this.phi), cp = Math.cos(this.phi);
    this.camera.position.set(
      this.target.x + this.radius * sp * Math.sin(this.theta),
      this.target.y + this.radius * cp,
      this.target.z + this.radius * sp * Math.cos(this.theta)
    );
    this.camera.lookAt(this.target);
  }
}

const VIEWS = {
  hero:   { theta: 0.82, phi: 1.16, radius: 112, target: [35.0, 7.5, 0] },
  front:  { theta: -1.42, phi: 1.30, radius: 70, target: [8.0, 7.0, 0] },
  side:   { theta: 0.00, phi: 1.44, radius: 118, target: [35.0, 7.0, 0] },
  top:    { theta: 0.02, phi: 0.09, radius: 104, target: [35.0, 7.0, 0] },
  nose:   { theta: -1.30, phi: 1.22, radius: 17, target: [5.5, 7.2, 0] },
  engine: { theta: 0.55, phi: 1.24, radius: 13, target: [32.5, 2.6, 11.6] },
  gear:   { theta: 0.95, phi: 1.30, radius: 13, target: [34.0, 1.9, 5.6] },
  tail:   { theta: 0.62, phi: 1.18, radius: 34, target: [62.0, 11.5, 0] }
};

/* -------------------------------- 15. MAIN ------------------------------- */
function main(root) {
  const app = document.getElementById('app') || document.body;
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;      // soft penumbra instead of a hard edge
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a2230, 260, 900);
  scene.background = SKY.bot.clone().lerp(SKY.mid, 0.45);

  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 20), skyMaterial());
  scene.add(sky);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.25, 2600);
  const controls = new Orbit(camera, renderer.domElement);
  controls.setView(VIEWS.hero, true);

  scene.environment = buildEnvironment(renderer);
  scene.environmentIntensity = 1.0;

  /* ---- lighting ---- */
  const hemi = new THREE.HemisphereLight(0x9fbfe6, 0x33383f, 0.78);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.05);
  sun.position.set(-58, 92, 66);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const sc = sun.shadow.camera;
  sc.left = -50; sc.right = 50; sc.top = 50; sc.bottom = -50; sc.near = 30; sc.far = 240;
  sun.shadow.bias = -0.0002;
  sun.shadow.normalBias = 0.02;
  sun.shadow.radius = 3.5;          // VSM penumbra
  sun.shadow.blurSamples = 16;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xbdd6ff, 0.55);
  fill.position.set(70, 40, -70);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.35);
  rim.position.set(30, 12, -90);
  scene.add(rim);

  /* ---- ground ---- */
  const groundMat = new THREE.MeshStandardMaterial({
    map: groundTexture(), color: 0xffffff, roughness: 0.95, metalness: 0.02
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  /* soft contact shadow under the fuselage and the engine pods */
  const contact = (() => {
    const { c, x } = makeCanvas(512, 512);
    const g = x.createRadialGradient(256, 256, 10, 256, 256, 250);
    g.addColorStop(0, 'rgba(0,0,0,0.42)');
    g.addColorStop(0.45, 'rgba(0,0,0,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(96, 34),
      new THREE.MeshBasicMaterial({ map: canvasTexture(c, { srgb: false }), transparent: true,
        depthWrite: false, opacity: 0.45 }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(0, 0.014, 0);
    return m;
  })();
  scene.add(contact);

  scene.add(root);

  /* ---- gear retraction ---- */
  const gearState = { down: 1, target: 1 };
  const gearGroup = root.getObjectByName('gear');
  const pivots = [], wellMeshes = [];
  if (gearGroup) {
    for (const leg of gearGroup.children.slice()) {
      if (leg.userData && leg.userData.well) { wellMeshes.push(leg); continue; }
      const p = leg.userData && leg.userData.trunnion;
      if (!p) continue;
      const pivot = new THREE.Group();
      pivot.position.copy(p);
      leg.position.sub(p);
      pivot.add(leg);
      gearGroup.add(pivot);
      pivots.push(pivot);
    }
  }

  /* ---- UI ---- */
  const specList = document.getElementById('specList');
  if (specList) {
    const rows = [
      ['Length', '70.66 m'], ['Wingspan', '64.44 m'], ['Height', '19.41 m'],
      ['Wing area', '525 m\u00B2'], ['MTOW', '396,890 kg'], ['Span (AR)', '7.9'],
      ['Engines', '4 \u00D7 CF6-80C2B1F'], ['Thrust', '4 \u00D7 63,300 lbf'],
      ['Cruise', 'M 0.85'], ['Range', '13,490 km'], ['Main tyres', 'H49\u00D719.0-22'],
      ['Wheelbase', '25.60 m'], ['Track', '11.70 m'], ['Wheels', '18']
    ];
    specList.innerHTML = rows.map(([k, v]) =>
      '<dt>' + k + '</dt><dd>' + v + '</dd>').join('');
  }
  document.querySelectorAll('#ui [data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = VIEWS[btn.dataset.view];
      if (v) controls.setView(v);
    });
  });
  const liverySel = document.getElementById('livery');
  if (liverySel) liverySel.addEventListener('change', () => applyLivery(root, liverySel.value));
  const spinSlider = document.getElementById('spin');
  if (spinSlider) spinSlider.addEventListener('input', () => { controls.spin = spinSlider.value / 100; });
  const gearBtn = document.getElementById('btnGear');
  if (gearBtn) gearBtn.addEventListener('click', () => {
    gearState.target = gearState.target > 0.5 ? 0 : 1;
    gearBtn.textContent = gearState.target > 0.5 ? 'Down' : 'Up';
    gearBtn.classList.toggle('on', gearState.target > 0.5);
  });
  const groundBtn = document.getElementById('btnGround');
  if (groundBtn) groundBtn.addEventListener('click', () => {
    ground.visible = !ground.visible;
    contact.visible = ground.visible;
    groundBtn.classList.toggle('on', ground.visible);
    groundBtn.textContent = ground.visible ? 'On' : 'Off';
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ---- loop ---- */
  let last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    controls.update(dt);
    if (Math.abs(gearState.down - gearState.target) > 0.001) {
      gearState.down += (gearState.target - gearState.down) * Math.min(1, dt * 1.6);
      for (const p of pivots) p.rotation.z = -1.52 * (1 - gearState.down);
      for (const w of wellMeshes) w.visible = gearState.down > 0.02;
    }
    renderer.render(scene, camera);
  });

  /* ---- automation hook (also handy for scripted camera moves) ---- */
  globalThis.__DHS747__ = {
    THREE, scene, camera, renderer, root, controls, VIEWS,
    setView(name, instant = true) {
      const v = VIEWS[name];
      if (v) { controls.setView(v, instant); controls.update(1); renderer.render(scene, camera); }
      return !!v;
    },
    setCam(theta, phi, radius, tx, ty, tz) {
      controls.tTheta = theta; controls.tPhi = clamp(phi, controls.minPhi, controls.maxPhi);
      controls.tRadius = clamp(radius, controls.minR, controls.maxR);
      if (tx !== undefined) controls.tTarget.set(tx - S.LENGTH / 2, ty, tz);
      controls.update(1);
      renderer.render(scene, camera);
    },
    setGear(down) { gearState.target = down ? 1 : 0; },
    wireframe(on) {
      scene.traverse(o => {
        if (!o.isMesh && !o.isInstancedMesh) return;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(m => { if (m && 'wireframe' in m) m.wireframe = !!on; });
      });
      renderer.render(scene, camera);
    },
    hide(name, vis) {
      const o = root.getObjectByName(name);
      if (o) o.visible = vis;
      renderer.render(scene, camera);
    },
    info: () => ({ triangles: renderer.info.render.triangles, calls: renderer.info.render.calls,
                   geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures })
  };

  const loader = document.getElementById('loader');
  if (loader) {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 900);
  }
}

/* ------------------------------ 16. BOOT --------------------------------- */
if (HEADLESS) {
  globalThis.__MODEL__ = {
    THREE, S, initMaterials, buildAircraft, applyLivery, buildFuselage, fuselageStation,
    wingSection, buildWingPanel, buildEngines, buildLandingGear, LIVERY, M
  };
} else {
  const yieldFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  loadMsg.textContent = 'building geometry';
  await yieldFrame();
  initMaterials();
  const root = buildAircraft();
  loadMsg.textContent = 'painting livery';
  await yieldFrame();
  applyLivery(root, 'house');
  loadMsg.textContent = 'lighting scene';
  await yieldFrame();
  main(root);
}
