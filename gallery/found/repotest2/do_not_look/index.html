<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boeing 747-400 &mdash; Ultra-Detailed Three.js Model</title>
<style>
  :root {
    --bg0: #05070d; --bg1: #0b1220; --ink: #e8eef8; --dim: #8fa3bf;
    --accent: #4ea8ff; --accent2: #ffc65c; --panel: rgba(10,16,28,.72);
    --line: rgba(120,160,220,.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  canvas { display: block; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40;
    background: radial-gradient(120% 100% at 50% 0%, #101a2c 0%, #05070d 70%); transition: opacity .7s ease; }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .box { text-align: center; }
  #loader h1 { font-size: 15px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase;
    margin: 0 0 18px; color: var(--dim); }
  #loader .bar { width: 260px; height: 2px; background: rgba(255,255,255,.08); overflow: hidden; margin: 0 auto; }
  #loader .bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.15s infinite linear; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  #loader p { margin: 14px 0 0; font-size: 11px; letter-spacing: .16em; color: #55708f; text-transform: uppercase; }
  .panel { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  #specs { left: 14px; bottom: 14px; width: 268px; padding: 12px 14px 10px; }
  #specs h2 { margin: 0 0 2px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  #specs .sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
  #specs dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 0; font-size: 11.5px; }
  #specs dt { color: var(--dim); }
  #specs dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d8e6ff; }
  #specs .sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 6px 0 4px; }
  #ui { right: 14px; top: 14px; width: 214px; padding: 11px 12px 12px; }
  #ui h3 { margin: 0 0 8px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  #ui .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #ui button { appearance: none; cursor: pointer; font: inherit; font-size: 11px; color: var(--ink);
    background: rgba(78,168,255,.10); border: 1px solid rgba(78,168,255,.28); border-radius: 8px;
    padding: 6px 4px; transition: background .18s, border-color .18s, transform .1s; }
  #ui button:hover { background: rgba(78,168,255,.22); border-color: rgba(78,168,255,.55); }
  #ui button:active { transform: translateY(1px); }
  #ui button.wide { grid-column: 1 / -1; }
  #ui button.on { background: rgba(255,198,92,.20); border-color: rgba(255,198,92,.6); color: #ffe9bd; }
  #ui .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 9px; font-size: 11px; color: var(--dim); }
  #ui select { font: inherit; font-size: 11px; color: var(--ink); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; outline: none; }
  #ui input[type=range] { width: 96px; accent-color: var(--accent); }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #4a607c;
    background: rgba(6,10,18,.55); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px;
    pointer-events: none; white-space: nowrap; }
  #tag { position: fixed; left: 14px; top: 14px; z-index: 20; font-size: 10px; letter-spacing: .22em;
    text-transform: uppercase; color: #55708f; }
  #tag b { color: var(--ink); letter-spacing: .1em; }
  @media (max-width: 820px) {
    #specs { display: none; } #ui { width: 168px; } #hint { display: none; }
  }
</style>
</head>
<body>
<div id="tag"><b>Boeing 747-400</b> &nbsp;/&nbsp; three.js</div>

<div id="specs" class="panel">
  <h2>747-400</h2>

  <dl id="specList"></dl>
</div>

<div id="ui" class="panel">

  <div class="grid">
    <button data-view="hero">3/4 Hero</button>

      <option value="classic">Classic</option>
    </select>
  </div>
  <div class="row"><span>Gear</span><button id="btnGear" style="flex:0 0 auto;padding:4px 9px">Down</button></div>
  <div class="row"><span>Spin</span><input id="spin" type="range" min="0" max="100" value="0" /></div>
  <div class="row"><span>Ground</span><button id="btnGround" class="on" style="flex:0 0 auto;padding:4px 9px">On</button></div>
</div>

<div id="hint">Drag to orbit &nbsp;·&nbsp; Wheel to zoom &nbsp;·&nbsp; Right-drag / two fingers to pan</div>

<div id="loader"><div class="box">
  <h1>Assembling 747-400</h1>
  <div class="bar"><i></i></div>
  <p id="loadMsg">loading three.js</p>
</div></div>

<script type="module">
/* ==========================================================================
   BOEING 747-400  —  ULTRA-DETAILED PROCEDURAL THREE.JS MODEL
   --------------------------------------------------------------------------
   All geometry is generated from published Boeing 747-400 dimensions
   (Boeing D6-58326-1 "747-400 Airplane Characteristics for Airport Planning"
   and the 747-400 spec sheet).  Units: metres.  Axes: +X aft, +Y up, +Z right.
   The nose tip sits at x = 0 and the tail cone tip at x = 70.66, so the whole
   aircraft is modelled in real-world coordinates and then centred for display.
   ========================================================================== */

/* ------------------------------- 0. LOADER ------------------------------- */
const loadMsg = document.getElementById('loadMsg');
const THREE_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
  'https://unpkg.com/three@0.169.0/build/three.module.js',
  'https://esm.sh/three@0.169.0',
  'https://cdn.skypack.dev/three@0.169.0'
];
async function loadThree() {
  if (globalThis.__DSH_THREE__) return globalThis.__DSH_THREE__;   // headless verify hook
  let lastErr = null;
  for (const url of THREE_URLS) {
    try { loadMsg.textContent = 'loading three.js'; const m = await import(url); return m; }
    catch (e) { lastErr = e; }
  }
  document.getElementById('loadMsg').textContent = 'could not load three.js — check your connection';
  throw lastErr;
}
const THREE = await loadThree();

/* --------------------------- 1. SPECIFICATION ---------------------------- */
const S = {
  /* fuselage */
  LENGTH: 70.66,            // overall length, nose tip -> tail cone tip
  FUS_W: 6.50,              // maximum external width  (21 ft 4 in)
  KEEL_Y: 1.71,             // ground to bottom of fuselage
  TOP_Y: 10.20,             // ground to top of fuselage (upper-deck crown)
  AFT_TOP_Y: 8.75,          // ground to top of fuselage aft of the upper deck
  MAIN_DECK_Y: 4.96,        // main deck floor / door sill (ACAP "C" 15 ft 6 in)
  UPPER_DECK_Y: 7.72,       // upper deck floor / door sill (ACAP "B" 24 ft 8 in)
  HOLD_Y: 3.02,             // lower hold floor
  LOWER_LOBE_R: 3.25,       // lower lobe radius (21 ft 4 in diameter)
  UPPER_LOBE_R: 1.95,       // upper lobe radius
  UPPER_LOBE_CY: 8.25,      // upper lobe centre height
  HUMP_END_X: 21.0,         // aft end of the stretched upper deck
  HUMP_FAIR_X: 24.8,        // aft end of the upper-deck fairing
  NOSE_FAIR_X: 9.4,         // end of the nose taper
  TAIL_FAIR_X: 52.0,        // start of the tail-cone taper

  /* wing */
  SPAN: 64.44,              // tip to tip, including the canted winglets
  SEMI: 31.73,              // basic wing semi-span (winglet adds 0.49 m of span)
  SEMI_TOTAL: 32.22,
  WING_AREA: 525,           // m^2, both panels
  ROOT_CHORD: 13.40,
  BREAK_Y: 12.90,           // "Yehudi" planform break, 40 % semi-span
  BREAK_CHORD: 8.85,
  TIP_CHORD: 3.80,
  LE_SWEEP_IN: 37.5 * Math.PI / 180,
  LE_SWEEP_OUT: 32.0 * Math.PI / 180,
  DIHEDRAL: 6.0 * Math.PI / 180,
  WING_ROOT_LE_X: 27.00,    // fuselage station of the wing root leading edge
  WING_ROOT_Y: 3.55,        // height of the wing root chord line
  WING_INCIDENCE: 2.0 * Math.PI / 180,
  WING_TWIST: -3.5 * Math.PI / 180,  // washout at the tip
  ROOT_T: 0.135, BREAK_T: 0.115, TIP_T: 0.088,   // thickness/chord
  WINGLET_H: 1.90,
  WINGLET_BASE_C: 2.55,
  WINGLET_TIP_C: 1.20,
  WINGLET_CANT: 15 * Math.PI / 180,

  /* tail */
  FIN_HEIGHT: 10.66,        // above the aft fuselage top
  FIN_ROOT_X: 55.4,         // fin root leading edge
  FIN_ROOT_CHORD: 11.00,
  FIN_TIP_CHORD: 3.40,
  FIN_SWEEP: 45 * Math.PI / 180,
  STAB_SPAN: 22.17,
  STAB_ROOT_CHORD: 8.40,
  STAB_TIP_CHORD: 3.40,
  STAB_LE_X: 57.5,
  STAB_Y: 8.20,
  STAB_SWEEP: 32 * Math.PI / 180,
  STAB_DIHEDRAL: 5 * Math.PI / 180,

  /* engines (CF6-80C2B1F) */
  ENGINE_Z_IN: 11.60,
  ENGINE_Z_OUT: 20.80,
  NACELLE_D: 2.70,
  NACELLE_BOTTOM: 0.80,
  FAN_D: 2.36,

  /* landing gear */
  NOSE_GEAR_X: 8.40,
  MAIN_GEAR_X: 34.00,
  BODY_GEAR_Z: 2.30,
  WING_GEAR_Z: 5.60,
  TIRE_D: 1.245,            // H49x19.0-22 main / 49x17 nose
  TIRE_W_MAIN: 0.483,
  TIRE_W_NOSE: 0.432,
  NOSE_TIRE_TRACK: 1.16,
  BOGIE_AXLE_DX: 1.44,      // fore/aft axle spacing on a bogie
  BOGIE_AXLE_DZ: 1.06       // lateral wheel spacing on a bogie
};

/* ----------------------------- 2. UTILITIES ------------------------------ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const smootherstep = t => { t = clamp(t, 0, 1); return t * t * t * (t * (6 * t - 15) + 10); };
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

/** Closed Catmull-Rom-ish interpolation of a scalar table over [0,1]. */
function sampleTable(tbl, t) {
  t = clamp(t, 0, 1);
  const n = tbl.length - 1;
  const f = t * n, i = Math.floor(f), u = f - i;
  const a = tbl[Math.max(0, i - 1)], b = tbl[i], c = tbl[Math.min(n, i + 1)], d = tbl[Math.min(n, i + 2)];
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
}

/** Merge an array of BufferGeometries (position/normal/uv only) into one. */
function mergeGeometries(geoms) {
  let vCount = 0, iCount = 0;
  for (const g of geoms) {
    const idx = g.getIndex();
    vCount += g.getAttribute('position').count;
    iCount += idx ? idx.count : g.getAttribute('position').count;
  }
  const pos = new Float32Array(vCount * 3);
  const nor = new Float32Array(vCount * 3);
  const uv = new Float32Array(vCount * 2);
  const idx = new Uint32Array(iCount);
  let vo = 0, io = 0;
  for (const g of geoms) {
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    const p = g.getAttribute('position'), n = g.getAttribute('normal');
    const t = g.getAttribute('uv') || null;
    const gi = g.getIndex();
    const count = p.count;
    pos.set(p.array, vo * 3);
    nor.set(n.array, vo * 3);
    if (t) uv.set(t.array, vo * 2);
    if (gi) { for (let k = 0; k < gi.count; k++) idx[io + k] = gi.array[k] + vo; io += gi.count; }
    else { for (let k = 0; k < count; k++) idx[io + k] = vo + k; io += count; }
    vo += count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

/** Make a lofted surface face outward: sample the face nearest `near` and
 *  flip the index order when its normal disagrees with `want`. */
function orientGeometry(geo, near, want) {
  const pos = geo.getAttribute('position'), idx = geo.getIndex();
  let best = -1, bestD = Infinity;
  for (let f = 0; f < idx.count; f += 3) {
    const a = idx.array[f], b = idx.array[f + 1], c = idx.array[f + 2];
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const cx = (ax + pos.getX(b) + pos.getX(c)) / 3;
    const cy = (ay + pos.getY(b) + pos.getY(c)) / 3;
    const cz = (az + pos.getZ(b) + pos.getZ(c)) / 3;
    const d = (cx - near.x) ** 2 + (cy - near.y) ** 2 + (cz - near.z) ** 2;
    if (d < bestD) { bestD = d; best = f; }
  }
  if (best < 0) return geo;
  const a = idx.array[best], b = idx.array[best + 1], c = idx.array[best + 2];
  const p0 = new THREE.Vector3(pos.getX(a), pos.getY(a), pos.getZ(a));
  const p1 = new THREE.Vector3(pos.getX(b), pos.getY(b), pos.getZ(b));
  const p2 = new THREE.Vector3(pos.getX(c), pos.getY(c), pos.getZ(c));
  const n = new THREE.Vector3().subVectors(p1, p0).cross(new THREE.Vector3().subVectors(p2, p0));
  if (n.dot(want) < 0) {
    for (let f = 0; f < idx.count; f += 3) { const t = idx.array[f + 1]; idx.array[f + 1] = idx.array[f + 2]; idx.array[f + 2] = t; }
    idx.needsUpdate = true;
  }
  return geo;
}

/**
 * Loft a stack of rings into a closed surface.
 * rings: array of { pts: [[y,z], ...] (equal length, ordered CCW looking aft),
 *                  x: station, u: texture coord along the length }
 * Closed in both directions (first ring and last ring are capped).
 */
function loftRings(rings, opts = {}) {
  const m = rings[0].pts.length;
  const n = rings.length;
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i < n; i++) {
    const r = rings[i];
    for (let j = 0; j < m; j++) {
      const p = r.pts[j];
      pos.push(r.x, p[0], p[1]);
      uvs.push(r.u, j / m);
    }
  }
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < m; j++) {
      const a = i * m + j, b = i * m + ((j + 1) % m);
      const c = (i + 1) * m + ((j + 1) % m), d = (i + 1) * m + j;
      idx.push(a, d, b, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  if (opts.orient) orientGeometry(g, opts.orient.near, opts.orient.want);
  return g;
}

/** Build a ring (array of [y,z]) from a half-profile [ [y, halfWidth], ... ]. */
function ringFromProfile(half, cx = 0) {
  const pts = [];
  for (let i = half.length - 1; i >= 0; i--) pts.push([half[i][0], cx + half[i][1]]);   // right side, top->keel
  for (let i = 1; i < half.length; i++) pts.push([half[i][0], cx - half[i][1]]);         // left side, keel->top
  return pts;
}

/* ------------------------------ 3. MATERIALS ----------------------------- */
const M = {};
function initMaterials() {

    color, roughness: rough, metalness: 0.02, clearcoat: clear, clearcoatRoughness: 0.12
  });

  M.white      = paint(0xf2f4f7, 0.30, 0.75);          // painted skin

                   metalness: 0.02, clearcoat: 0.8, clearcoatRoughness: 0.14 });

                   metalness: 0.02, clearcoat: 0.8, clearcoatRoughness: 0.14 });
  M.wing       = paint(0xeff1f4, 0.34, 0.6);
  M.wingUpper  = paint(0xe9ecf0, 0.42, 0.4);
  M.grey       = paint(0xb9c0c9, 0.55, 0.2);
  M.darkGrey   = paint(0x4a4f57, 0.6, 0.15);
  M.antiGlare  = paint(0x2a2d33, 0.5, 0.2);
  M.radome     = paint(0xe6e9ee, 0.34, 0.55);          // radome is painted, not black
  M.glare      = paint(0x24272c, 0.62, 0.10);          // matte anti-glare shield
  M.metal      = new THREE.MeshStandardMaterial({ color: 0xc9cfd6, metalness: 0.95, roughness: 0.24 });
  M.metalDark  = new THREE.MeshStandardMaterial({ color: 0x6d737b, metalness: 0.9, roughness: 0.42 });
  M.hot        = new THREE.MeshStandardMaterial({ color: 0x3a3630, metalness: 0.85, roughness: 0.55 });
  M.engineCow  = paint(0xe8ebef, 0.34, 0.5);
  M.engineIn   = new THREE.MeshStandardMaterial({ color: 0x6b727b, metalness: 0.35, roughness: 0.55 });
  M.fanBlade   = new THREE.MeshStandardMaterial({ color: 0xd3d9e0, metalness: 0.85, roughness: 0.28 });
  M.tire       = new THREE.MeshStandardMaterial({ color: 0x15171b, metalness: 0.0, roughness: 0.92 });
  M.hub        = new THREE.MeshStandardMaterial({ color: 0xa9b0b8, metalness: 0.85, roughness: 0.35 });
  M.chrome     = new THREE.MeshStandardMaterial({ color: 0xd8dde3, metalness: 1.0, roughness: 0.14 });
  M.seal       = new THREE.MeshStandardMaterial({ color: 0x8c9299, metalness: 0.3, roughness: 0.75 });
  M.gap        = new THREE.MeshStandardMaterial({ color: 0x2b2e33, metalness: 0.2, roughness: 0.9 });
  M.glass      = new THREE.MeshPhysicalMaterial({ color: 0x0d1a2b, roughness: 0.06, metalness: 0.15,

  M.cabinGlass = new THREE.MeshPhysicalMaterial({ color: 0x101c2c, roughness: 0.05, metalness: 0.2,
                   clearcoat: 1.0, clearcoatRoughness: 0.03 });
  M.navRed     = new THREE.MeshStandardMaterial({ color: 0x3a0508, emissive: 0xff2b2b, emissiveIntensity: 2.2, roughness: 0.3 });
  M.navGreen   = new THREE.MeshStandardMaterial({ color: 0x04331a, emissive: 0x2bff6a, emissiveIntensity: 2.2, roughness: 0.3 });
  M.navWhite   = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, emissive: 0xffffff, emissiveIntensity: 1.6, roughness: 0.3 });
  M.beacon     = new THREE.MeshStandardMaterial({ color: 0x3a0508, emissive: 0xff1a1a, emissiveIntensity: 3.0, roughness: 0.3 });
  M.landing    = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xfff3d0, emissiveIntensity: 2.6, roughness: 0.25 });
  M.decal      = new THREE.MeshPhysicalMaterial({ transparent: true, roughness: 0.35, metalness: 0.0,
                   clearcoat: 0.6, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3,
                   depthWrite: false });
  M.matPaint   = new THREE.MeshPhysicalMaterial({ transparent: true, roughness: 0.5, clearcoat: 0.4,
                   polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, depthWrite: false });
  M.ground     = new THREE.MeshStandardMaterial({ color: 0x2a2e35, roughness: 0.94, metalness: 0.02 });
}

/* --------------------------- 4. TEXTURE HELPERS -------------------------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, x: c.getContext('2d') };
}
function canvasTexture(canvas, { repeat = null, aniso = 8, srgb = true } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.needsUpdate = true;
  return t;
}
/** deterministic pseudo-random so the aircraft looks identical on every load */
let _seed = 20250101;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }

function addNoise(ctx, w, h, amount = 8, size = 1) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * amount * 2;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  ctx.putImageData(img, 0, 0);
}

const LIVERY = {
  house: {
    name: 'BOEING',
    upper: '#ffffff', belly: '#c9ced6', stripe: '#0b3f91', stripe2: '#f2b705',
    tail: '#0b3f91', tailInk: '#ffffff', text: '#123c74', text2: '#7b8794',
    reg: 'N747DS', accent: '#0b3f91'
  },
  aurora: {
    name: 'AURORA AIR',

/**
 * Fuselage skin texture.
 * v = 0 at the keel, 0.5 at the crown, 1 at the keel on the other side
 * (ring is generated keel -> right side -> crown -> left side -> keel).
 */
function fuselageTexture(L) {
  const W = 4096, H = 1024;
  const { c, x } = makeCanvas(W, H);
  // base paint
  x.fillStyle = L.upper; x.fillRect(0, 0, W, H);

  // belly panels: the lowest 22 % on both sides
  const belly = 0.115;
  const gBelly = x.createLinearGradient(0, 0, 0, H * belly);
  gBelly.addColorStop(0, L.belly); gBelly.addColorStop(1, L.upper);
  x.fillStyle = gBelly; x.fillRect(0, 0, W, H * belly);
  x.save(); x.translate(0, H); x.scale(1, -1);
  x.fillStyle = gBelly; x.fillRect(0, 0, W, H * belly);
  x.restore();

  // cheatline just under the window band (v ~ 0.245 on the right side)
  const bandY = 0.238 * H;
  x.fillStyle = L.stripe; x.fillRect(0, bandY, W, 0.022 * H);
  x.fillStyle = L.stripe2; x.fillRect(0, bandY + 0.022 * H, W, 0.006 * H);
  x.save(); x.translate(0, H); x.scale(1, -1);
  x.fillStyle = L.stripe; x.fillRect(0, bandY, W, 0.022 * H);
  x.fillStyle = L.stripe2; x.fillRect(0, bandY + 0.022 * H, W, 0.006 * H);
  x.restore();

  // panel lines (station lines and stringers)
  x.strokeStyle = 'rgba(120,132,148,0.30)'; x.lineWidth = 1.4;
  for (let i = 1; i < 60; i++) {
    const u = (i / 60) * W;
    x.beginPath(); x.moveTo(u, 0); x.lineTo(u, H); x.stroke();
  }
  x.strokeStyle = 'rgba(120,132,148,0.22)';
  for (let i = 1; i < 46; i++) {
    const v = (i / 46) * H;
    x.beginPath(); x.moveTo(0, v); x.lineTo(W, v); x.stroke();
  }

  // subtle dirt streaks behind the doors / over the wing
  x.globalAlpha = 0.10;
  for (let i = 0; i < 130; i++) {
    const u = rnd() * W, v = (0.10 + rnd() * 0.30) * H;
    const g = x.createLinearGradient(u, v, u + 90, v);
    g.addColorStop(0, 'rgba(70,80,95,0.7)'); g.addColorStop(1, 'rgba(70,80,95,0)');
    x.fillStyle = g; x.fillRect(u, v, 90, 3 + rnd() * 5);
  }
  x.globalAlpha = 1;
  addNoise(x, W, H, 4);
  return canvasTexture(c);
}

/** Vertical-fin texture: paint + logo. */
function finTexture(L) {

/** Wing skin texture: walkway, panel lines, "no step" markings. */
function wingTexture() {

  for (let i = 1; i < 26; i++) { const v = (i / 26) * H; x.beginPath(); x.moveTo(0, v); x.lineTo(W, v); x.stroke(); }

/** Ground: concrete apron with joints, oil stains and a taxi line. */
function groundTexture() {
  const W = 2048, H = 2048;
  const { c, x } = makeCanvas(W, H);
  x.fillStyle = '#3a3f47'; x.fillRect(0, 0, W, H);
  // large slab joints
  x.strokeStyle = 'rgba(20,24,30,0.55)'; x.lineWidth = 3;
  const step = W / 16;
  for (let i = 0; i <= 16; i++) {
    x.beginPath(); x.moveTo(i * step, 0); x.lineTo(i * step, H); x.stroke();
    x.beginPath(); x.moveTo(0, i * step); x.lineTo(W, i * step); x.stroke();
  }
  // stains and patches
  for (let i = 0; i < 220; i++) {
    const px = rnd() * W, py = rnd() * H, r = 8 + rnd() * 90;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(20,22,26,' + (0.05 + rnd() * 0.13) + ')');
    g.addColorStop(1, 'rgba(20,22,26,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  // fine grain
  addNoise(x, W, H, 14);
  const t = canvasTexture(c, { repeat: [26, 26] });
  return t;
}

/* ------------------------------ 5. FUSELAGE ------------------------------ */
const RING_M = 48;                       // profile samples per half section
const RING_N = RING_M * 2 - 1;           // points around one ring

const H0 = S.TOP_Y - S.KEEL_Y;           // 8.49 m  (double-lobe section)
const H1 = S.AFT_TOP_Y - S.KEEL_Y;       // 7.04 m  (single-lobe section)
const FLOOR_FRAC = (S.MAIN_DECK_Y - S.KEEL_Y) / H0;

function humpFactor(x) {
  if (x <= S.HUMP_END_X) return 1;
  if (x >= S.HUMP_FAIR_X) return 0;
  return 1 - smootherstep((x - S.HUMP_END_X) / (S.HUMP_FAIR_X - S.HUMP_END_X));
}

function fuselageStation(x) {
  const hump = humpFactor(x);
  if (x <= S.NOSE_FAIR_X) {
    const t = x / S.NOSE_FAIR_X;
    /* superellipse-ish nose: blunt radome, full mid-nose, tangent into the barrel */
    const s = Math.pow(1 - Math.pow(1 - t, 2.2), 0.85);
    const H = H0 * s;
    const keel = S.MAIN_DECK_Y - FLOOR_FRAC * H;   // scales about the main-deck line
    return { hump: 1, H, keel, topY: keel + H, halfW: (S.FUS_W / 2) * s };
  }
  if (x >= S.TAIL_FAIR_X) {
    const t = (x - S.TAIL_FAIR_X) / (S.LENGTH - S.TAIL_FAIR_X);
    const keel = S.KEEL_Y + 2.59 * Math.pow(t, 1.5);
    const top = S.AFT_TOP_Y - 3.65 * Math.pow(t, 1.15);
    const H = Math.max(0.06, top - keel);
    return { hump: 0, H, keel, topY: keel + H, halfW: (S.FUS_W / 2) * Math.pow(H / H1, 0.8) };
  }
  const H = H1 + (H0 - H1) * hump;
  return { hump, H, keel: S.KEEL_Y, topY: S.KEEL_Y + H, halfW: S.FUS_W / 2 };
}

/** Normalised half-profile (ny 0 = keel, 1 = crown; nw 1 = max half width). */
function profileShape(hump, M) {
  const out = [];
  const R = S.LOWER_LOBE_R, cy = S.LOWER_LOBE_R;             // lower lobe centre (local y)
  const R1 = S.UPPER_LOBE_R, cy1 = S.UPPER_LOBE_CY - S.KEEL_Y; // upper lobe centre (local y)
  const yc = 5.92;                                            // lobe intersection
  for (let k = 0; k < M; k++) {
    const ny = 0.5 - 0.5 * Math.cos(Math.PI * k / (M - 1));
    // double-lobe shape
    const yA = ny * H0;
    let wA;
    if (yA <= yc) wA = Math.sqrt(Math.max(0, R * R - (yA - cy) * (yA - cy)));
    else wA = Math.sqrt(Math.max(0, R1 * R1 - (yA - cy1) * (yA - cy1)));
    // smooth the lobe junction
    const blend = smoothstep((yA - (yc - 0.55)) / 1.10);
    const wA2 = Math.sqrt(Math.max(0, R1 * R1 - (yA - cy1) * (yA - cy1)));
    const wA3 = Math.sqrt(Math.max(0, R * R - (yA - cy) * (yA - cy)));
    wA = lerp(wA3, wA2, blend);
    // single-lobe shape
    const yB = ny * H1;
    let wB;
    if (yB <= cy) wB = Math.sqrt(Math.max(0, R * R - (yB - cy) * (yB - cy)));
    else wB = R * Math.sqrt(Math.max(0, 1 - Math.pow((yB - cy) / (H1 - cy), 2)));
    const nw = lerp(wB, wA, hump) / R;
    out.push({ ny, nw });
  }
  out[0].nw = 0;
  out[M - 1].nw = 0;
  return out;
}
const PROF_HUMP = profileShape(1, RING_M);
const PROF_AFT  = profileShape(0, RING_M);

/** Half profile for a station: [{y, w}] from keel to crown. */
function stationProfile(st) {
  const prof = st.hump > 0.999 ? PROF_HUMP : st.hump < 0.001 ? PROF_AFT : null;
  const pts = [];
  for (let k = 0; k < RING_M; k++) {
    let ny, nw;
    if (prof) { ny = prof[k].ny; nw = prof[k].nw; }
    else {
      ny = PROF_HUMP[k].ny;
      nw = lerp(PROF_AFT[k].nw, PROF_HUMP[k].nw, st.hump);
    }
    pts.push([st.keel + ny * st.H, nw * st.halfW]);
  }
  return pts;
}

/** Ring for the loft: keel -> right side -> crown -> left side -> keel. */
function stationRing(st) {
  const half = stationProfile(st);
  const pts = [];
  for (let k = 0; k < half.length; k++) pts.push([half[k][0], half[k][1]]);
  for (let k = half.length - 2; k >= 0; k--) pts.push([half[k][0], -half[k][1]]);
  return pts;
}

/** Fuselage station list: dense at the nose and tail. */
function fuselageStations() {
  const xs = [];
  const nose = [0, 0.18, 0.42, 0.75, 1.15, 1.65, 2.25, 2.95, 3.75, 4.65, 5.65, 6.75, 7.95, S.NOSE_FAIR_X];
  for (const v of nose) xs.push(v);
  for (let x = 10.6; x < S.TAIL_FAIR_X - 0.01; x += 1.6) xs.push(x);
  const tail = [];
  for (let t = 0.03; t <= 1.0001; t += 0.03) {
    tail.push(S.TAIL_FAIR_X + (S.LENGTH - S.TAIL_FAIR_X) * Math.pow(t, 0.82));
  }
  for (const v of tail) if (v > S.TAIL_FAIR_X + 0.05) xs.push(Math.min(v, S.LENGTH));
  return xs;
}

/** Build the complete fuselage shell (with the nose and tail caps). */
function buildFuselage() {
  const xs = fuselageStations();
  const rings = [];
  for (const x of xs) {
    const st = fuselageStation(x);
    rings.push({ x, pts: stationRing(st), u: x / S.LENGTH, st });
  }
  // nose cap: collapse to the tip
  const noseTip = { x: 0.0, pts: stationRing(fuselageStation(0)), u: 0 };
  const capN = [];
  const st0 = fuselageStation(0);
  const yTip = st0.keel + FLOOR_FRAC * st0.H;
  for (let j = 0; j < RING_N; j++) capN.push([yTip, 0]);
  rings.unshift({ x: 0.0, pts: capN, u: 0 });
  // tail cap
  const stT = fuselageStation(S.LENGTH);
  const yT = stT.keel + 0.45 * stT.H;
  const capT = [];
  for (let j = 0; j < RING_N; j++) capT.push([yT, 0]);
  rings.push({ x: S.LENGTH, pts: capT, u: 1 });

  const geo = loftRings(rings.map(r => ({ x: r.x, pts: r.pts, u: r.u })));
  geo.computeVertexNormals();
  return { geo, xs };
}

/** Surface point + normal for a station x and ring parameter v (0..1). */
const _surfaceCache = new Map();
function fuselageSurface(x, v) {
  x = clamp(x, 0, S.LENGTH);
  const st = fuselageStation(x);
  let key = x.toFixed(2);
  let prof = _surfaceCache.get(key);
  if (!prof) { prof = stationProfile(st); _surfaceCache.set(key, prof); }
  // ring parameter -> half profile index
  const j = clamp(v, 0, 1) * (RING_N - 1);
  let idx, sign;
  if (j <= RING_M - 1) { idx = j; sign = 1; }
  else { idx = (RING_N - 1) - j; sign = -1; }
  const i0 = Math.floor(idx), i1 = Math.min(RING_M - 1, i0 + 1), f = idx - i0;
  const y = lerp(prof[i0][0], prof[i1][0], f);
  const w = lerp(prof[i0][1], prof[i1][1], f);
  return new THREE.Vector3(x, y, sign * w);
}
function fuselageNormal(x, v, out = new THREE.Vector3()) {
  const e = 0.05;
  const p = fuselageSurface(x, v);
  const a = fuselageSurface(x + e, v).sub(p);
  const b = fuselageSurface(x, clamp(v + 0.004, 0, 1)).sub(p);
  out.copy(a).cross(b).normalize();     // dP/dx x dP/dv = outward
  return out;
}

/** Curved decal / panel patch hugging the fuselage. */
function fuselagePatch(x0, x1, v0, v1, nx, nv, offset, mat, flip = false) {
  const pos = [], uvs = [], idx = [];
  const nrm = new THREE.Vector3();
  for (let i = 0; i <= nx; i++) {
    for (let j = 0; j <= nv; j++) {
      const x = lerp(x0, x1, i / nx), v = lerp(v0, v1, j / nv);
      const p = fuselageSurface(x, v);
      fuselageNormal(x, v, nrm);
      p.addScaledVector(nrm, offset);
      pos.push(p.x, p.y, p.z);
      uvs.push(i / nx, j / nv);
    }
  }
  for (let i = 0; i < nx; i++) for (let j = 0; j < nv; j++) {
    const a = i * (nv + 1) + j, b = a + 1, c = a + (nv + 1), d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const cm = fuselageSurface((x0 + x1) / 2, (v0 + v1) / 2);
  const cn = fuselageNormal((x0 + x1) / 2, (v0 + v1) / 2);
  orientGeometry(g, cm, cn);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

/** Convert a height on the fuselage side into a ring parameter v. */
function vAtY(x, y, side = 1) {
  const st = fuselageStation(x);
  const prof = stationProfile(st);
  const target = y - st.keel;
  let lo = 0, hi = RING_M - 1;
  for (let k = 0; k < 24; k++) {
    const mid = (lo + hi) / 2, i0 = Math.floor(mid), i1 = Math.min(RING_M - 1, i0 + 1);
    const yy = lerp(prof[i0][0], prof[i1][0], mid - i0);
    if (yy < st.keel + target) lo = mid; else hi = mid;
  }
  const idx = (lo + hi) / 2;
  const v = idx / (RING_N - 1);
  return side > 0 ? v : 1 - v;
}

/* ------------------------ 5b. FUSELAGE DETAIL PARTS ---------------------- */
function roundedRectGeo(w, h, r, depth, bevel = 0.012) {
  const s = new THREE.Shape();
  const x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0); s.quadraticCurveTo(x1, y0, x1, y0 + r);
  s.lineTo(x1, y1 - r); s.quadraticCurveTo(x1, y1, x1 - r, y1);
  s.lineTo(x0 + r, y1); s.quadraticCurveTo(x0, y1, x0, y1 - r);
  s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
  const g = new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel,
    bevelSegments: 2, curveSegments: 5, steps: 1
  });
  g.translate(0, 0, -depth / 2);
  return g;
}

/** Place a small part on the fuselage surface, oriented to the local normal. */
function surfaceMatrix(x, y, side, roll = 0, offset = 0) {
  const v = vAtY(x, y, side);
  const p = fuselageSurface(x, v);
  const n = fuselageNormal(x, v);
  const up = new THREE.Vector3(0, 1, 0);
  up.addScaledVector(n, -up.dot(n));
  if (up.lengthSq() < 1e-6) up.set(0, 1, 0);
  up.normalize();
  const right = new THREE.Vector3().crossVectors(up, n).normalize();
  if (roll) {
    const q = new THREE.Quaternion().setFromAxisAngle(n, roll);
    up.applyQuaternion(q); right.applyQuaternion(q);
  }
  p.addScaledVector(n, offset);
  const m = new THREE.Matrix4().makeBasis(right, up, n);
  m.setPosition(p);
  return m;
}

/** Main-deck + upper-deck window band (two instanced meshes: frame + glass). */
function buildWindows() {
  const frameGeo = roundedRectGeo(0.30, 0.40, 0.055, 0.012, 0.008);
  const glassGeo = roundedRectGeo(0.235, 0.335, 0.05, 0.012, 0.006);
  const frames = [], glass = [];
  const put = (x, y, side) => {
    const m = surfaceMatrix(x, y, side, 0, 0.0015);
    frames.push(m.clone());
    const m2 = surfaceMatrix(x, y, side, 0, 0.006);
    glass.push(m2);
  };

  /* ---- main deck: 747-400 has a continuous window line with door gaps ---- */
  const mainWinY = 6.06;
  const pitch = 0.53;
  const doorX = [7.1, 14.9, 27.6, 35.4, 48.6];
  const skip = [[5.4, 8.9], [13.1, 16.7], [25.9, 29.3], [33.7, 37.1], [46.9, 50.3], [52.0, 53.4]];
  const inSkip = x => skip.some(([a, b]) => x > a && x < b);
  for (let x = 6.2; x <= 52.2; x += pitch) {
    if (inSkip(x)) continue;
    put(x, mainWinY, 1); put(x, mainWinY, -1);
  }

  /* ---- upper deck: stretched upper deck of the -300/-400 ---- */
  const upWinY = 8.34;
  for (let x = 5.6; x <= 19.4; x += 0.86) {
    put(x, upWinY, 1); put(x, upWinY, -1);
  }

  const fMesh = new THREE.InstancedMesh(frameGeo, M.white, frames.length);
  const gMesh = new THREE.InstancedMesh(glassGeo, M.cabinGlass, glass.length);
  frames.forEach((m, i) => fMesh.setMatrixAt(i, m));
  glass.forEach((m, i) => gMesh.setMatrixAt(i, m));
  fMesh.instanceMatrix.needsUpdate = true; gMesh.instanceMatrix.needsUpdate = true;
  fMesh.castShadow = false; gMesh.castShadow = false;
  return [fMesh, gMesh];
}

/** Door placard texture (used on the passenger-door patches). */
function doorTexture(kind) {
  const W = 256, H = 420;
  const { c, x } = makeCanvas(W, H);
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(120,132,148,0.55)'; x.lineWidth = 3;
  x.strokeRect(4, 4, W - 8, H - 8);
  x.strokeStyle = 'rgba(150,160,172,0.35)'; x.lineWidth = 1.4;
  x.strokeRect(16, 16, W - 32, H - 32);
  if (kind === 'pax') {
    // window in the door
    x.fillStyle = '#101c2c';
    x.beginPath();
    const rw = 46, rh = 66, rx = W / 2, ry = H * 0.30;
    x.moveTo(rx - rw / 2 + 10, ry - rh / 2);
    x.lineTo(rx + rw / 2 - 10, ry - rh / 2);
    x.quadraticCurveTo(rx + rw / 2, ry, rx + rw / 2 - 10, ry + rh / 2);
    x.lineTo(rx - rw / 2 + 10, ry + rh / 2);
    x.quadraticCurveTo(rx - rw / 2, ry, rx - rw / 2 + 10, ry - rh / 2);
    x.fill();
    // handle
    x.fillStyle = '#c8ced6';
    x.fillRect(W * 0.70, H * 0.52, 16, 54);
    x.fillStyle = '#8c939c';
    x.fillRect(W * 0.70 + 3, H * 0.52 + 4, 10, 46);
    // EXIT placard
    x.fillStyle = '#b81b1b';
    x.fillRect(W * 0.14, H * 0.62, 62, 20);
    x.fillStyle = '#fff'; x.font = 'bold 14px sans-serif';
    x.fillText('EXIT', W * 0.14 + 10, H * 0.62 + 15);
    x.fillStyle = '#3a4450'; x.font = '11px ui-monospace, monospace';
    x.fillText('PUSH', W * 0.14, H * 0.70);
  } else {
    // cargo door: louvre vents + placard
    x.fillStyle = '#e7eaee'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#c3c9d1';
    for (let i = 0; i < 7; i++) x.fillRect(W * 0.18, H * 0.22 + i * 16, W * 0.64, 8);
    x.fillStyle = '#4a5260'; x.font = 'bold 13px sans-serif';

  }
  return canvasTexture(c);
}

/** Passenger / cargo door: skin patch carrying the door artwork plus a
 *  recessed shadow line so the door reads as a real cut-out. */
function buildDoor(x, sillY, wAlongX, hArc, side, kind, tex) {
  const g = new THREE.Group();
  /* j=0 of the patch must sit at the bottom of the door on both sides, so the
     ring parameter is passed in bottom -> top order (it decreases with height
     on the port side). */
  const vBot = vAtY(x, sillY, side), vTop = vAtY(x, sillY + hArc, side);
  const va = Math.min(vBot, vTop), vb = Math.max(vBot, vTop);
  const mat = M.decal.clone();
  mat.map = tex; mat.transparent = false; mat.roughness = 0.32;
  mat.depthWrite = true;
  mat.polygonOffset = true; mat.polygonOffsetFactor = -4; mat.polygonOffsetUnits = -4;
  g.add(fuselagePatch(x - wAlongX / 2, x + wAlongX / 2, vBot, vTop, 8, 12, 0.006, mat, side < 0));
  /* shadow line: four thin dark strips just inside the door outline */
  const seamMat = new THREE.MeshBasicMaterial({ color: 0x0a0d12, transparent: true, opacity: 0.55 });
  const edge = 0.035;
  const strips = [
    [x - wAlongX / 2, x - wAlongX / 2 + edge, va, vb],
    [x + wAlongX / 2 - edge, x + wAlongX / 2, va, vb],
  ];
  for (const [a, b, c, d] of strips) {
    g.add(fuselagePatch(a, b, c, d, 2, 8, 0.004, seamMat, side < 0));
  }
  g.add(fuselagePatch(x - wAlongX / 2, x + wAlongX / 2, va, va + 0.012, 8, 2, 0.004, seamMat, side < 0));
  g.add(fuselagePatch(x - wAlongX / 2, x + wAlongX / 2, vb - 0.012, vb, 8, 2, 0.004, seamMat, side < 0));
  return g;
}

/** All doors of the 747-400: 5 main-deck + 1 upper-deck per side, 2 lower cargo. */
function buildDoors() {
  const g = new THREE.Group();
  const paxTex = doorTexture('pax');

  const mainDoors = [7.10, 14.90, 27.60, 35.40, 48.60];

/** Windshield artwork: dark frame, blue-black glass, wiper sweep highlight. */
function windshieldTexture() {
  const W = 512, H = 256;
